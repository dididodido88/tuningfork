---
# Settings shared by every host in lab.

env_name: lab
env_domain: lab.local

# Internal time sources, used by linux.yml and windows.yml.
env_ntp_servers:
  - dc1.lab.local
  - dc2.lab.local

# Banner text shown on Linux and Windows logins.
env_banner_text: >-
  Authorized lab users only. All activity may be monitored and reported.

# Internal mirror (e.g. Nexus) that serves packages and binaries in this
# air-gapped environment.
env_mirror_base_url: https://registry.lab.local/
