---
- name: Nexus | Check required variables
  ansible.builtin.assert:
    that:
      - nexus_server_version | length > 0
      - nexus_server_download_url | length > 0
    fail_msg: Set nexus_server_version and nexus_server_download_url (internal mirror) in group_vars/nexus_servers.yml.
    quiet: true
  tags: [nexus_server]

- name: Nexus | Install Java
  ansible.builtin.package:
    name: "{{ nexus_server_java_package }}"
    state: present
  when: nexus_server_java_package | length > 0
  tags: [nexus_server]

- name: Nexus | Create group
  ansible.builtin.group:
    name: "{{ nexus_server_group }}"
    system: true
  tags: [nexus_server]

- name: Nexus | Create user
  ansible.builtin.user:
    name: "{{ nexus_server_user }}"
    group: "{{ nexus_server_group }}"
    home: "{{ nexus_server_data_dir }}"
    shell: /sbin/nologin
    system: true
    create_home: false
  tags: [nexus_server]

- name: Nexus | Create install root
  ansible.builtin.file:
    path: "{{ nexus_server_install_root }}"
    state: directory
    owner: root
    group: "{{ nexus_server_group }}"
    mode: "0750"
  tags: [nexus_server]

- name: Nexus | Download release from internal mirror
  ansible.builtin.get_url:
    url: "{{ nexus_server_download_url }}"
    dest: "{{ nexus_server_install_root }}/nexus-{{ nexus_server_version }}.tar.gz"
    checksum: "{{ nexus_server_download_checksum | default(omit, true) }}"
    validate_certs: "{{ nexus_server_validate_certs }}"
    owner: root
    group: root
    mode: "0640"
  tags: [nexus_server]

- name: Nexus | Unpack release
  ansible.builtin.unarchive:
    src: "{{ nexus_server_install_root }}/nexus-{{ nexus_server_version }}.tar.gz"
    dest: "{{ nexus_server_install_root }}"
    remote_src: true
    creates: "{{ nexus_server_install_dir }}/bin/nexus"
  tags: [nexus_server]

- name: Nexus | Give the nexus user its data directory
  ansible.builtin.file:
    path: "{{ nexus_server_data_dir }}"
    state: directory
    owner: "{{ nexus_server_user }}"
    group: "{{ nexus_server_group }}"
    recurse: true
  tags: [nexus_server]

- name: Nexus | Point the current symlink at this version
  ansible.builtin.file:
    src: "{{ nexus_server_install_dir }}"
    dest: "{{ nexus_server_link }}"
    state: link
  notify: Restart nexus
  tags: [nexus_server]

- name: Nexus | Set JVM heap sizes
  ansible.builtin.lineinfile:
    path: "{{ nexus_server_install_dir }}/bin/nexus.vmoptions"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - {regexp: '^-Xms', line: "-Xms{{ nexus_server_jvm_min_heap }}"}
    - {regexp: '^-Xmx', line: "-Xmx{{ nexus_server_jvm_max_heap }}"}
    - {regexp: '^-XX:MaxDirectMemorySize=', line: "-XX:MaxDirectMemorySize={{ nexus_server_jvm_max_direct_memory }}"}
  loop_control:
    label: "{{ item.line }}"
  notify: Restart nexus
  tags: [nexus_server]

- name: Nexus | Install systemd unit
  ansible.builtin.template:
    src: nexus.service.j2
    dest: /etc/systemd/system/nexus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart nexus
  tags: [nexus_server]

- name: Nexus | Enable and start nexus
  ansible.builtin.systemd:
    name: nexus
    daemon_reload: true
    enabled: true
    state: started
  tags: [nexus_server]

- name: Nexus | Open firewall port
  ansible.posix.firewalld:
    port: "{{ nexus_server_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: nexus_server_manage_firewall | bool
  tags: [nexus_server, firewall]
