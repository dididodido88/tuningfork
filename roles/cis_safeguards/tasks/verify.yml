---
# Runs after RHEL9-CIS and its handlers (sshd restart, crypto policy, PAM).
# Opens a NEW SSH connection and runs sudo, the way the next login will.
# If this fails the play stops, so later hosts in the rollout aren't touched.

- name: Verify | sshd configuration is valid
  ansible.builtin.command: sshd -t
  changed_when: false
  check_mode: false

- name: Verify | Effective sshd settings for the Ansible account
  ansible.builtin.shell: |
    set -o pipefail
    sshd -T -C user={{ cis_safeguards_account }},host=localhost,addr=127.0.0.1 |
      grep -Ei '^(allowusers|allowgroups|denyusers|denygroups|permitrootlogin|pubkeyauthentication) '
  register: cis_safeguards_sshd_effective
  changed_when: false
  check_mode: false

- name: Verify | AllowUsers is not set
  ansible.builtin.assert:
    that: cis_safeguards_sshd_effective.stdout_lines | select('match', '(?i)^allowusers ') | list | length == 0
    fail_msg: "sshd has AllowUsers set; only AllowGroups should control access: {{ cis_safeguards_sshd_effective.stdout_lines }}"
    quiet: true

- name: Verify | Drop the existing connection
  ansible.builtin.meta: reset_connection

- name: Verify | New SSH connection and sudo still work
  ansible.builtin.command: id -u
  register: cis_safeguards_become_check
  changed_when: false
  check_mode: false
  failed_when: cis_safeguards_become_check.stdout | trim != '0'
