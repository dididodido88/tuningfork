---
# Override per environment in inventories/<ENV>/group_vars/nfs_servers.yml.

nfs_server_packages:
  - nfs-utils

# One entry per export. Directories are created if missing.
#   - path: /srv/nfs/share1
#     owner: root
#     group: root
#     mode: "0755"
#     clients:
#       - host: 10.0.0.0/24
#         options: rw,sync,root_squash
nfs_server_exports: []

nfs_server_manage_firewall: true
nfs_server_firewalld_services:
  - nfs
  - mountd
  - rpc-bind
