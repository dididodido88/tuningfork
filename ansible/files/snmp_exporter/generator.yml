---
# snmp_exporter generator input for the Dell iDRAC 9 module (docs/siem.md, "snmp_exporter iDRAC
# module"; run on the download machine). Object names come from the Dell iDRAC-SMIv2 MIB
# (IDRAC-MIB-SMIv2); the generator stops with an error naming any object the MIB doesn't define.
#
# Status objects use the Dell ObjectStatusEnum: 1 other, 2 unknown, 3 ok, 4 nonCritical,
# 5 critical, 6 nonRecoverable. Prometheus alert rules treat anything other than 3 as not OK.

auths:
  # Placeholder: the real SNMPv3 credentials are templated by roles/snmp_exporter from the vault.
  idrac_v3:
    version: 3
    security_level: authPriv
    username: placeholder
    password: placeholder
    auth_protocol: SHA256
    priv_protocol: AES
    priv_password: placeholder

modules:
  dell_idrac:
    walk:
      # Whole system
      - globalSystemStatus
      - systemLCDStatus
      - globalStorageStatus
      - systemPowerState
      - systemPowerUpTime
      - systemStateTable
      # Components
      - powerSupplyTable
      - coolingDeviceTable
      - temperatureProbeTable
      - memoryDeviceTable
      - processorDeviceTable
      - physicalDiskTable
      - virtualDiskTable
    max_repetitions: 25
    retries: 3
    timeout: 10s
