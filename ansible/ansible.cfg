# Run every command from the ansible/ directory (cd ansible) so this file is picked up.
# Ansible ignores ansible.cfg in a world-writable directory.
#
# No default inventory is set on purpose: always pick the environment explicitly,
#   ansible-playbook -i inventories/CRGS00 playbooks/site.yml

[defaults]
roles_path = roles
collections_path = collections
# Only use the vendored collections in ./collections (air-gapped, pinned versions).
collections_scan_sys_path = False
interpreter_python = auto_silent
host_key_checking = True
forks = 20
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 7200
retry_files_enabled = False
callback_result_format = yaml
# Uncomment the vault id for the environment you run, or pass --vault-id on the command line.
# vault_identity_list = CRGS00@prompt

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
