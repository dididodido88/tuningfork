---
# CRGS02: NAS servers, NFS exports (roles/nas_server/README.md).
#
# One export per NAS data disk. Terraform creates and sizes the disks
# (terraform/_envcommon/roles/nas.hcl) and the filesystems role mounts them, so keep this list in
# step with that file: a path here that has no disk ends up on the root file system.

nas_server_exports:
  # Persistent volumes of the application cluster, created by csi-driver-nfs (storage classes
  # m-shared-pv and m-dedicated-pv). Only the app nodes mount it. no_root_squash: the driver
  # creates and owns each volume folder as root (decided by the user; root on those nodes already
  # holds cluster-admin).
  - path: /export/pvcdata
    clients:
      - host: 203.0.113.51  # REPLACE
        options: rw,sync,no_root_squash
      - host: 203.0.113.52  # REPLACE
        options: rw,sync,no_root_squash
      - host: 203.0.113.53  # REPLACE
        options: rw,sync,no_root_squash
  - path: /export/cfr
    clients:
      - host: 203.0.113.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/testdata
    clients:
      - host: 203.0.113.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/deliveries
    clients:
      - host: 203.0.113.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/backups
    clients:
      - host: 203.0.113.0/24  # REPLACE
        options: rw,sync,root_squash

# Networks or single addresses allowed through the firewall to NFS. Keep them in line with the
# export clients above.
nas_server_firewall_sources:
  - 203.0.113.0/24  # REPLACE
