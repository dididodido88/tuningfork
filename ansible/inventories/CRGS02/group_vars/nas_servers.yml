---
# CRGS02: NAS servers, NFS exports (roles/nas_server/defaults/main.yml).

nas_server_exports:
  - path: /srv/nfs/share
    clients:
      - host: 203.0.113.0/24
        options: rw,sync,root_squash

# Networks or single addresses allowed through the firewall to NFS (roles/nas_server).
nas_server_firewall_sources:
  - 203.0.113.0/24  # REPLACE

