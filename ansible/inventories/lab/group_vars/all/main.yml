---
# Settings shared by every host in lab.

env_name: lab
env_domain: lab.local

# Internal time sources, used by linux.yml and windows.yml.
env_ntp_servers:
  - 192.168.70.101
  - 192.168.70.102

# Banner text shown on Linux and Windows logins.
env_banner_text: >-
  Authorized users only. All activity may be monitored and reported.

# Base URL of the internal mirror (air-gapped). The single source for every download:
#   <env_repo_base_url>/rocky/repo/9/...              RPM repositories + GPG keys (roles/repositories)
#   <env_repo_base_url>/harbor/<version>/             Harbor offline installer (roles/harbor)
#   <env_repo_base_url>/kubernetes/<version>/         kubectl (roles/kubectl)
#   <env_repo_base_url>/kubernetes/tools/...          helm, k9s, kubectx/kubens (roles/k8s_bastion)
# HTTPS with a certificate from the internal CA: playbooks/certificates.yml must run first
# (site.yml does); the other playbooks check the CA is trusted before downloading.
env_repo_base_url: https://maestro

# Folder of this environment under /srv/security/certificates/files on the control node
# (roles/certificates: root CA in ca/, one folder per short hostname).
certificates_env_dir: lab.local

# kubectl version for every host in kubectl_hosts (roles/kubectl). Keep it within one minor
# version of the clusters. Served from <env_repo_base_url>/kubernetes/<kubectl_version>/ (kubectl,
# kubectl-convert and their .sha256 files).
kubectl_version: v1.36.5
