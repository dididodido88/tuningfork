---
# lab inventory. Replace the example hosts with real ones.
#
# Group model (keep identical in every environment):
#   linux            -> rocky9                          (OS-family common config + CIS)
#   windows          -> windows_server, windows_desktop (OS-family common config)
#   nfs_servers, db_servers, registry_servers           (server roles)
#   siem_servers                                        (the SIEM VM: Wazuh, Prometheus, Grafana; docs/siem.md)
#   proxmox_hosts, idrac                                (Proxmox VE hosts and their iDRACs; monitored by the SIEM VM)
#   k8s_nodes, wazuh_agents, node_exporter_hosts        (Kubernetes nodes; which hosts get the SIEM agents)
#   k8s_bastions                                        (Kubernetes bastion hosts)
#   kubectl_hosts    -> k8s_bastions                    (hosts that get kubectl; add others directly)
#
# A host belongs to one OS group and to any number of server-role groups.
#
# Rocky 9 VMs provisioned by Terraform are listed in the terraform_<unit>.yml files (generated by
# the units in terraform/live/lab; Ansible loads them with this file). Remove a host from this file
# once Terraform manages it, so it is defined in one place only.

all:
  children:
    linux:
      children:
        rocky9:
          hosts:
            nas.lab.local:
              ansible_host: 192.168.70.70
            registry.lab.local:
              ansible_host: 192.168.70.71
            db.lab.local:
              ansible_host: 192.168.70.72
            pss.lab.local:
              ansible_host: 192.168.70.73
            sentinel.lab.local:
              ansible_host: 192.168.70.74
            mgmt.lab.local:
              ansible_host: 192.168.70.75
            lb-rancher.lab.local:
              ansible_host: 192.168.70.77
            lb-app.lab.local:
              ansible_host: 192.168.70.78
            rancher01.lab.local:
              ansible_host: 192.168.70.81
            rancher02.lab.local:
              ansible_host: 192.168.70.82
            rancher03.lab.local:
              ansible_host: 192.168.70.83
            node01.lab.local:
              ansible_host: 192.168.70.91
            node02.lab.local:
              ansible_host: 192.168.70.92
            node03.lab.local:
              ansible_host: 192.168.70.93

    windows:
      children:
        windows_server:
          hosts:
        windows_desktop:
          hosts:

    nfs_servers:
      hosts:

    db_servers:
      hosts:

    registry_servers:
      hosts:
        registry.lab.local:

    # sentinel.lab.local is built by Terraform: terraform_sentinel.yml puts it in this group.
    siem_servers:
      hosts:

    # Proxmox VE hosts (Debian 13). Not in linux: they get only the SIEM agent and exporters
    # (docs/siem.md), not the Rocky layers.
    proxmox_hosts:
      hosts:
        pve1.lab.local:
          ansible_host: 192.168.70.11
        pve2.lab.local:
          ansible_host: 192.168.70.12
        pve3.lab.local:
          ansible_host: 192.168.70.13
        pve4.lab.local:
          ansible_host: 192.168.70.14

    # Dell iDRAC 9 of each Proxmox host, configured through Redfish from the control node
    # (group_vars/idrac.yml); they send syslog and SNMP traps to the SIEM VM.
    idrac:
      hosts:
        pve1m.lab.local:
          ansible_host: 192.168.70.21
        pve2m.lab.local:
          ansible_host: 192.168.70.22
        pve3m.lab.local:
          ansible_host: 192.168.70.23
        pve4m.lab.local:
          ansible_host: 192.168.70.24

    k8s_bastions:
      hosts:
        mgmt.lab.local:

    # Kubernetes cluster nodes (Rancher). They get the Wazuh agent but not node_exporter: Rancher's
    # monitoring runs its own node-exporter on 9100 on cluster nodes.
    k8s_nodes:
      hosts:
        rancher01.lab.local:
        rancher02.lab.local:
        rancher03.lab.local:
        node01.lab.local:
        node02.lab.local:
        node03.lab.local:

    # Hosts with the Wazuh agent (playbooks/wazuh_agent_linux.yml skips the SIEM VM: it is the
    # manager and monitors itself).
    wazuh_agents:
      children:
        rocky9:
        proxmox_hosts:

    # Hosts with node_exporter, scraped by the SIEM VM (k8s_nodes are skipped).
    node_exporter_hosts:
      children:
        rocky9:
        proxmox_hosts:

    kubectl_hosts:
      children:
        k8s_bastions:
