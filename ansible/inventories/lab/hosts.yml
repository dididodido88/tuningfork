---
# lab inventory. Replace the example hosts with real ones.
#
# Group model (keep identical in every environment):
#   linux            -> rocky9                          (OS-family common config + CIS)
#   windows          -> windows_server, windows_desktop (OS-family common config)
#   nfs_servers, db_servers, registry_servers           (server roles)
#   k8s_bastions                                        (Kubernetes bastion hosts)
#   kubectl_hosts    -> k8s_bastions                    (hosts that get kubectl; add others directly)
#
# A host belongs to one OS group and to any number of server-role groups.
#
# Rocky 9 VMs provisioned by Terraform are listed in terraform_rocky9.yml (generated by
# terraform/live/lab/rocky9; Ansible loads it with this file). Remove a host from this file
# once Terraform manages it, so it is defined in one place only.

all:
  children:
    linux:
      children:
        rocky9:
          hosts:
            registry.lab.local:
              ansible_host: 192.168.70.71
            mgmt.lab.local:
              ansible_host: 192.168.70.72

    windows:
      children:
        windows_server:
          hosts:
        windows_desktop:
          hosts:

    nfs_servers:
      hosts:

    db_servers:
      hosts:

    registry_servers:
      hosts:
        registry.lab.local:

    k8s_bastions:
      hosts:
        mgmt.lab.local:

    kubectl_hosts:
      children:
        k8s_bastions:
