---
# CRGS00: the SIEM VM. Roles: postfix_relay, wazuh_server, syslog_receiver, snmp_trap_receiver,
# alertmanager, snmp_exporter, pve_exporter, prometheus, grafana (playbooks/siem.yml; every option is in
# roles/<role>/defaults/main.yml). Shared settings: group_vars/all/siem.yml. Secrets: vault_wazuh_* and
# vault_postfix_relay_password in group_vars/all/vault.yml. Guide: docs/siem.md.

# Wazuh indexer JVM heap. The SIEM VM has 16 GB, shared with the manager, the dashboard,
# Prometheus and Grafana.
wazuh_server_indexer_heap: 4g

# Prometheus keeps 90 days, or less if this size is reached first (the disk is 100 GB).
prometheus_retention_size: 85GB
