---
# Settings shared by every host in CRGS00.

env_name: CRGS00
env_domain: example.internal

# Internal time sources, used by linux.yml and windows.yml.
env_ntp_servers:
  - ntp1.example.internal
  - ntp2.example.internal

# Banner text shown on Linux and Windows logins.
env_banner_text: >-
  Authorized users only. All activity may be monitored and reported.

# Base URL of the internal mirror (air-gapped). The single source for every download:
#   <env_repo_base_url>/rocky/repo/9/...              RPM repositories + GPG keys (roles/repositories)
#   <env_repo_base_url>/harbor/<version>/             Harbor offline installer (roles/harbor)
#   <env_repo_base_url>/kubernetes/kubectl/<version>/ kubectl (roles/kubectl)
#   <env_repo_base_url>/kubernetes/<tool>/<version>/  k9s, kubectx, kubens (roles/k8s_bastion)
#   <env_repo_base_url>/helm/<version>/               helm client (roles/k8s_bastion; charts in helm/charts/)
#   <env_repo_base_url>/rancher/rke2/<version>/       RKE2 install.sh, tarball, checksums, SELinux RPM (roles/rke2_server)
#   <env_repo_base_url>/rancher/<version>/            Rancher chart (copied to the control node for terraform/k8s)
#   <env_repo_base_url>/{wazuh,prometheus,grafana,mibs,clamav}/  SIEM stack artifacts (group_vars/all/siem_versions.yml)
# HTTPS with a certificate from the internal CA: playbooks/certificates.yml must run first
# (site.yml does); the other playbooks check the CA is trusted before downloading.
env_repo_base_url: https://maestro

# Folder of this environment under /srv/security/certificates/files on the control node
# (roles/certificates: root CA in ca/, one folder per short hostname).
certificates_env_dir: crgs00.local

# kubectl version for every host in kubectl_hosts (roles/kubectl). Keep it within one minor
# version of the clusters. Served from <env_repo_base_url>/kubernetes/kubectl/<kubectl_version>/
# (kubectl, kubectl-convert and their .sha256 files). kubectl_checksums pins their hashes, so
# change both together.
kubectl_version: v1.36.5
kubectl_checksums:
  kubectl: "sha256:33bc88a24c3b09cf55bfd59e6ca977881b61fc3f25ab65bc80c65b430248648e"
  kubectl-convert: "sha256:b0a3635d5e3dee8f3dcc175fae6824434943dbbeb6ef1bb1384ef11a7223a01a"

# Rancher Server: the one name for its web UI (80/443), the Kubernetes API of the Rancher
# cluster (6443) and RKE2 registration (9345). DNS A record to the virtual IP of lb-rancher
# (keepalived_vip in terraform/live/<ENV>/lb-rancher). Used by roles/load_balancer and
# roles/rke2_server; the Terraform unit terraform/k8s/<ENV>/rancher-server uses the same default.
rancher_hostname: "rancher.{{ env_domain }}"

# Application cluster (docs/app-cluster.md). One name for its Kubernetes API (6443) and, when
# standalone, RKE2 registration (9345); applications use the same virtual IP for 80/443. DNS A
# record to the virtual IP of lb-app (keepalived_vip in terraform/live/<ENV>/lb-app).
app_cluster_hostname: "command-pro.{{ env_domain }}"
# false: standalone RKE2, installed by Ansible (playbooks/rke2_app.yml), reached with its admin
#        kubeconfig; lb-app carries 80, 443, 6443 and 9345.
# true:  managed by Rancher Server, which installs RKE2 on the nodes and handles node joins;
#        lb-app carries 80, 443 and 6443 (Authorized Cluster Endpoint). playbooks/rke2_app.yml
#        prepares the hosts and joins them with the registration token it reads from Rancher.
app_cluster_rancher_managed: false
