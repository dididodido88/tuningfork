---
# SIEM and observability stack: settings every host needs (agents and exporters report to the
# SIEM VM). Versions and checksums: siem_versions.yml. Guide: docs/siem.md.

# The SIEM VM (also listed in hosts.yml under siem_servers).
siem_server_name: crgs00-siem01.example.internal
siem_server_ip: 192.0.2.14

# Networks allowed to reach the SIEM VM (firewalld on the SIEM VM).
#   siem_agent_networks: Wazuh agents (1514/tcp, 1515/tcp)
#   siem_admin_networks: browsers for the Wazuh dashboard and Grafana
siem_agent_networks:
  - 192.0.2.0/24
siem_admin_networks:
  - 192.0.2.0/24

# --- Email (best effort) ---------------------------------------------------------------------
# Services on the SIEM VM send mail to the local Postfix relay (roles/postfix_relay), which
# forwards it to this SMTP server. While the relay is unset or unreachable, mail waits in the
# Postfix queue (up to postfix_relay_queue_lifetime); nothing else is held up.
siem_mail_relay_host: ""                # CHANGEME: SMTP server, e.g. smtp.crgs00.local
siem_mail_relay_port: 25
# none: plain SMTP; may: STARTTLS when offered; encrypt: STARTTLS required (certificate checked
# against the system trust store, which holds the internal CA).
siem_mail_relay_tls: may
# Leave empty if the SMTP server accepts the SIEM VM without a login. Password:
# vault_postfix_relay_password.
siem_mail_relay_username: ""
siem_mail_from: "siem@{{ env_domain }}"
siem_mail_to: []                        # CHANGEME: alert recipients, e.g. [soc@crgs00.local]

# --- Log and trap senders ------------------------------------------------------------------------
# Addresses allowed to send syslog (514/udp+tcp) and SNMP traps (162/udp) to the SIEM VM: every
# host in the proxmox_hosts and idrac groups (traps: idrac only), plus these addresses.
siem_log_senders_extra: []
siem_log_senders: >-
  {{ ((groups['proxmox_hosts'] | default([])) + (groups['idrac'] | default([])))
     | map('extract', hostvars, 'ansible_host') | list + siem_log_senders_extra }}
siem_trap_senders: >-
  {{ (groups['idrac'] | default([])) | map('extract', hostvars, 'ansible_host') | list + siem_log_senders_extra }}

# SNMPv3 users the iDRACs send traps with (roles/snmp_trap_receiver). Filled in with the iDRAC
# configuration; empty: every trap is dropped.
siem_snmp_trap_users: []

# --- Monitoring credentials (non-secret parts; passwords and tokens are in the vault) -------------
# SNMPv3 user the SIEM VM polls the iDRACs with (read-only). Passwords:
# vault_snmp_idrac_auth_password, vault_snmp_idrac_priv_password.
siem_idrac_snmp_username: tuningfork-poll
# Proxmox VE API user (PVEAuditor) and token the SIEM VM reads the cluster with. Token value:
# vault_pve_exporter_token_value.
siem_pve_api_user: tuningfork-monitor@pve
siem_pve_token_name: prometheus
