---
# CRGS01: NAS servers, NFS exports (roles/nas_server/README.md).
#
# One export per NAS data disk. Terraform creates and sizes the disks
# (terraform/_envcommon/roles/nas.hcl) and the filesystems role mounts them, so keep this list in
# step with that file: a path here that has no disk ends up on the root file system.

nas_server_exports:
  - path: /export/pvcdata
    clients:
      - host: 198.51.100.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/cfr
    clients:
      - host: 198.51.100.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/testdata
    clients:
      - host: 198.51.100.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/deliveries
    clients:
      - host: 198.51.100.0/24  # REPLACE
        options: rw,sync,root_squash
  - path: /export/backups
    clients:
      - host: 198.51.100.0/24  # REPLACE
        options: rw,sync,root_squash

  # Persistent volumes of the Rancher cluster, created by csi-driver-nfs. Only the Rancher nodes
  # mount it. no_root_squash: the driver creates and owns each volume folder as root (decided by
  # the user; root on those nodes already holds cluster-admin).
  - path: /export/rancher_cluster
    clients:
      - host: 198.51.100.41  # REPLACE
        options: rw,sync,no_root_squash
      - host: 198.51.100.42  # REPLACE
        options: rw,sync,no_root_squash
      - host: 198.51.100.43  # REPLACE
        options: rw,sync,no_root_squash

# Networks or single addresses allowed through the firewall to NFS. Keep them in line with the
# export clients above.
nas_server_firewall_sources:
  - 198.51.100.0/24  # REPLACE
