---
# CRGS01: the application RKE2 cluster (roles/rke2_server/defaults/main.yml lists every option;
# docs/app-cluster.md covers both modes, the scratch disk and the run order).
# The nodes are the hosts of this group, written by terraform/live/CRGS01/app-cluster
# (terraform_app-cluster.yml): 1 or 3.

rke2_cluster_group: rke2_app
# Kubeconfig on the control node (standalone mode): ~/.kube/CRGS01-app-cluster.yaml.
rke2_cluster_name: app-cluster

# Standalone or managed by Rancher Server: set app_cluster_rancher_managed in group_vars/all/main.yml.
rke2_rancher_managed: "{{ app_cluster_rancher_managed | default(false) }}"
# Managed mode: the cluster's name in Rancher (app_cluster_name in terraform/k8s/<ENV>/rancher-config,
# default command-pro). The nodes join it with its registration token, read from Rancher.
rke2_rancher_cluster: command-pro

# --- Version and artifacts on the mirror ---------------------------------------------------
# <env_repo_base_url>/rancher/rke2/<rke2_version>/: install.sh, rke2.linux-amd64.tar.gz,
# sha256sum-amd64.txt and <rke2_selinux_rpm> (maestro: /repo/rancher/rke2/<rke2_version>/)
# Usually the same as the Rancher cluster (group_vars/rke2_rancher.yml).
rke2_version: ""                     # REPLACE, e.g. v1.36.5+rke2r1
rke2_install_sh_checksum: ""         # REPLACE: sha256:<hash> of install.sh, recorded when downloading
# The SELinux policy is needed in both modes.
rke2_selinux_rpm: ""                 # REPLACE, e.g. rke2-selinux-0.24-1.el9.noarch.rpm
rke2_selinux_checksum: ""            # REPLACE: sha256:<hash>

# --- Cluster ---------------------------------------------------------------------------------
# Join secret shared by the nodes (standalone mode): a long random string in the vault
# (openssl rand -hex 32).
rke2_token: "{{ vault_rke2_app_token | default('') }}"

# Nodes after the first join through the load balancer: https://<app_cluster_hostname>:9345.
rke2_registration_host: "{{ app_cluster_hostname }}"
# The virtual IP of lb-app (keepalived_vip, from terraform_lb-app.yml).
rke2_registration_vip: >-
  {{ groups['lb_app'] | default([]) | map('extract', hostvars)
     | selectattr('keepalived_vip', 'defined') | map(attribute='keepalived_vip') | first | default('') }}
# Names and addresses the Kubernetes API certificate must cover.
rke2_tls_san: "{{ [app_cluster_hostname, rke2_registration_vip] | select | list }}"

# --- Disks -----------------------------------------------------------------------------------
# Each its own data disk (terraform/_envcommon/roles/rke2-app.hcl); the play stops otherwise.
rke2_required_mounts: [/var/lib/rancher, /var/lib/kubelet, /scratch]
# Local scratch space workloads mount as a hostPath: labelled for containers under SELinux.
rke2_container_paths: [/scratch]
