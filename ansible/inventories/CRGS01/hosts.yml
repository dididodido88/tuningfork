---
# CRGS01 inventory. Replace the example hosts with real ones.
#
# Group model (keep identical in every environment):
#   linux            -> rocky9                          (OS-family common config + CIS)
#   windows          -> windows_server, windows_desktop (OS-family common config)
#   nas_servers, db_servers, registry_servers           (server roles)
#   siem_servers                                        (the SIEM VM: Wazuh, Prometheus, Grafana; docs/siem.md)
#   proxmox_hosts, idrac                                (Proxmox VE hosts and their iDRACs; monitored by the SIEM VM)
#   k8s_nodes, wazuh_agents, node_exporter_hosts        (Kubernetes nodes; which hosts get the SIEM agents)
#   k8s_bastions                                        (Kubernetes bastion hosts)
#   kubectl_hosts    -> k8s_bastions                    (hosts that get kubectl; add others directly)
#
# A host belongs to one OS group and to any number of server-role groups.
#
# Rocky 9 VMs provisioned by Terraform are listed in the terraform_<unit>.yml files (generated by
# the units in terraform/live/CRGS01; Ansible loads them with this file). Remove a host from this file
# once Terraform manages it, so it is defined in one place only.

all:
  children:
    linux:
      children:
        rocky9:
          hosts:
            crgs01-nas01.example.internal:
              ansible_host: 198.51.100.11
            crgs01-db01.example.internal:
              ansible_host: 198.51.100.12
            crgs01-registry01.example.internal:
              ansible_host: 198.51.100.13
            crgs01-siem01.example.internal:
              ansible_host: 198.51.100.14

    windows:
      children:
        windows_server:
          hosts:
            crgs01-ws01.example.internal:
              ansible_host: 198.51.100.21
        windows_desktop:
          hosts:
            crgs01-wd01.example.internal:
              ansible_host: 198.51.100.31

    nas_servers:
      hosts:
        crgs01-nas01.example.internal:

    db_servers:
      hosts:
        crgs01-db01.example.internal:

    registry_servers:
      hosts:
        crgs01-registry01.example.internal:

    siem_servers:
      hosts:
        crgs01-siem01.example.internal:

    # Proxmox VE hosts (Debian 13): SIEM agent and exporters only (docs/siem.md).
    proxmox_hosts:
      hosts:

    # Dell iDRAC 9 controllers, configured through Redfish from the control node.
    idrac:
      hosts:

    k8s_bastions:
      hosts:

    # Kubernetes cluster nodes (Rancher). They get the Wazuh agent but not node_exporter: Rancher's
    # monitoring runs its own node-exporter on 9100 on cluster nodes.
    k8s_nodes:
      hosts:

    # Hosts with the Wazuh agent (playbooks/wazuh_agent_linux.yml skips the SIEM VM: it is the
    # manager and monitors itself).
    wazuh_agents:
      children:
        rocky9:
        proxmox_hosts:

    # Hosts with node_exporter, scraped by the SIEM VM (k8s_nodes are skipped).
    node_exporter_hosts:
      children:
        rocky9:
        proxmox_hosts:

    kubectl_hosts:
      children:
        k8s_bastions:
