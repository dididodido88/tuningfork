---
# CRGS01 inventory. Replace the example hosts with real ones.
#
# Group model (keep identical in every environment):
#   linux            -> rocky9                          (OS-family common config + CIS)
#   windows          -> windows_server, windows_desktop (OS-family common config)
#   nfs_servers, db_servers, nexus_servers              (server roles)
#
# A host belongs to one OS group and to any number of server-role groups.
#
# Rocky 9 VMs provisioned by Terraform are listed in terraform_rocky9.yml (generated by
# terraform/live/CRGS01/rocky9; Ansible loads it with this file). Remove a host from this file
# once Terraform manages it, so it is defined in one place only.

all:
  children:
    linux:
      children:
        rocky9:
          hosts:
            crgs01-nfs01.example.internal:
              ansible_host: 198.51.100.11
            crgs01-db01.example.internal:
              ansible_host: 198.51.100.12
            crgs01-nexus01.example.internal:
              ansible_host: 198.51.100.13

    windows:
      children:
        windows_server:
          hosts:
            crgs01-ws01.example.internal:
              ansible_host: 198.51.100.21
        windows_desktop:
          hosts:
            crgs01-wd01.example.internal:
              ansible_host: 198.51.100.31

    nfs_servers:
      hosts:
        crgs01-nfs01.example.internal:

    db_servers:
      hosts:
        crgs01-db01.example.internal:

    nexus_servers:
      hosts:
        crgs01-nexus01.example.internal:
