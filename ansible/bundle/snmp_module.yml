---
# snmp_exporter module for Dell iDRAC (snmp-idrac.yml, "modules:" only; roles/snmp_exporter adds the
# SNMPv3 auth from the vault). Uses the stock module if the release's snmp.yml has one, otherwise
# runs the snmp_exporter generator of the same version (container image) on
# files/snmp_exporter/generator.yml and the Dell iDRAC-SMIv2 MIB.

- name: Bundle | Unpack snmp_exporter to read its stock snmp.yml
  ansible.builtin.unarchive:
    src: "{{ bundle_dir }}/siem/snmp_exporter/{{ snmp_exporter_version }}/{{ siem_artifacts.snmp_exporter.file }}"
    dest: "{{ bundle_work_dir }}"
    creates: "{{ bundle_work_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-amd64/snmp.yml"

- name: Bundle | Read the stock snmp.yml
  ansible.builtin.slurp:
    src: "{{ bundle_work_dir }}/snmp_exporter-{{ snmp_exporter_version }}.linux-amd64/snmp.yml"
  register: bundle_stock_snmp

- name: Bundle | Look for a Dell iDRAC module in the stock snmp.yml
  ansible.builtin.set_fact:
    bundle_stock_idrac_modules: >-
      {{ (bundle_stock_snmp.content | b64decode | from_yaml).modules | default({})
         | dict2items | selectattr('key', 'search', '(?i)idrac|dell') | items2dict }}

- name: Bundle | Generate the iDRAC module
  when: bundle_stock_idrac_modules | length == 0
  block:
    - name: Bundle | Prepare the generator directory
      ansible.builtin.file:
        path: "{{ bundle_work_dir }}/snmp-gen/mibs"
        state: directory
        mode: "0755"

    - name: Bundle | Copy generator.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/snmp_exporter/generator.yml"
        dest: "{{ bundle_work_dir }}/snmp-gen/generator.yml"
        mode: "0644"

    # The iDRAC MIB imports the standard SNMPv2 MIBs; net-snmp on the staging machine provides them.
    - name: Bundle | Copy the MIBs
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cp /usr/share/snmp/mibs/* "{{ bundle_work_dir }}/snmp-gen/mibs/"
          cp "{{ bundle_manual_dir }}/{{ siem_artifacts.dell_idrac_mib.file }}" "{{ bundle_work_dir }}/snmp-gen/mibs/"
        executable: /bin/bash
      changed_when: true

    - name: Bundle | Run the snmp_exporter generator {{ snmp_exporter_version }}
      ansible.builtin.command:
        argv:
          - "{{ bundle_container_runtime }}"
          - run
          - --rm
          - -v
          - "{{ bundle_work_dir }}/snmp-gen:/opt:Z"
          - "docker.io/prom/snmp-generator:v{{ snmp_exporter_version }}"
          - generate
      changed_when: true

    - name: Bundle | Read the generated snmp.yml
      ansible.builtin.slurp:
        src: "{{ bundle_work_dir }}/snmp-gen/snmp.yml"
      register: bundle_generated_snmp

    - name: Bundle | Take the iDRAC module from the generated snmp.yml
      ansible.builtin.set_fact:
        bundle_idrac_modules: "{{ (bundle_generated_snmp.content | b64decode | from_yaml).modules }}"

- name: Bundle | Write snmp-idrac.yml
  ansible.builtin.copy:
    dest: "{{ bundle_dir }}/siem/snmp_exporter/{{ snmp_exporter_version }}/{{ siem_artifacts.snmp_exporter_idrac_module.file }}"
    mode: "0644"
    content: |
      # Dell iDRAC module for snmp_exporter {{ snmp_exporter_version }} ({{ 'stock' if bundle_stock_idrac_modules else 'generated from ' ~ siem_artifacts.dell_idrac_mib.file }}).
      {{ {'modules': bundle_stock_idrac_modules if bundle_stock_idrac_modules else bundle_idrac_modules} | to_nice_yaml(indent=2) }}
