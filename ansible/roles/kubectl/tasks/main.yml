---
- name: Kubectl | Check the version is set
  ansible.builtin.assert:
    that:
      - kubectl_version is match('^v\d+\.\d+\.\d+$')
      - kubectl_checksum | length == 0 or kubectl_checksum is match('^sha256:[0-9a-fA-F]{64}$')
    fail_msg: >-
      Set kubectl_version (e.g. v1.31.0) in inventories/<ENV>/group_vars/all/main.yml, and if
      kubectl_checksum is set it must be sha256:<64 hex characters>.
    quiet: true
  tags: [kubectl]

- name: Kubectl | Create the version directory
  ansible.builtin.file:
    path: "{{ kubectl_install_dir }}/{{ kubectl_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [kubectl]

- name: Kubectl | Download kubectl {{ kubectl_version }} from the mirror
  ansible.builtin.get_url:
    url: "{{ kubectl_url }}"
    dest: "{{ kubectl_install_dir }}/{{ kubectl_version }}/kubectl"
    checksum: "{{ kubectl_checksum if kubectl_checksum | length > 0 else 'sha256:' ~ kubectl_url ~ '.sha256' }}"
    owner: root
    group: root
    mode: "0755"
  tags: [kubectl]

# A plain symlink: only Ansible changes the active version. Older versions stay on disk.
- name: Kubectl | Point {{ kubectl_bin_link }} at {{ kubectl_version }}
  ansible.builtin.file:
    src: "{{ kubectl_install_dir }}/{{ kubectl_version }}/kubectl"
    dest: "{{ kubectl_bin_link }}"
    state: link
    force: true
  tags: [kubectl]

- name: Kubectl | Check the installed version
  ansible.builtin.command:
    argv: ["{{ kubectl_bin_link }}", version, --client, -o, json]
  register: kubectl_client
  changed_when: false
  failed_when: >-
    kubectl_client.rc != 0
    or (kubectl_client.stdout | from_json).clientVersion.gitVersion != kubectl_version
  check_mode: false
  when: not ansible_check_mode
  tags: [kubectl]

- name: Kubectl | Bash completion
  when: kubectl_bash_completion | bool
  tags: [kubectl]
  block:
    - name: Kubectl | Install bash-completion
      ansible.builtin.dnf:
        name: bash-completion
        state: present

    - name: Kubectl | Generate the completion script
      ansible.builtin.command:
        argv: ["{{ kubectl_bin_link }}", completion, bash]
      register: kubectl_completion
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Kubectl | Install the completion script
      ansible.builtin.copy:
        content: "{{ kubectl_completion.stdout }}\n"
        dest: /etc/bash_completion.d/kubectl
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode
