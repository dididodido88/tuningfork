---
- name: Kubectl | Check the mirror and version are set
  ansible.builtin.assert:
    that:
      - (env_repo_base_url | default('')) is match('^https?://')
      - kubectl_version is match('^v\d+\.\d+\.\d+$')
      - kubectl_binaries | length > 0 and 'kubectl' in kubectl_binaries
      - kubectl_checksums.values() | reject('match', '^sha256:[0-9a-fA-F]{64}$') | list | length == 0
    fail_msg: >-
      Set env_repo_base_url (mirror base URL) and kubectl_version (e.g. v1.36.5) in
      inventories/<ENV>/group_vars/all/main.yml. kubectl_binaries must include kubectl, and any
      kubectl_checksums entry must be sha256:<64 hex characters>.
    quiet: true
  tags: [kubectl]

- name: Kubectl | Create the version directory
  ansible.builtin.file:
    path: "{{ kubectl_install_dir }}/{{ kubectl_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [kubectl]

- name: Kubectl | Download {{ kubectl_version }} binaries from the mirror
  ansible.builtin.get_url:
    url: "{{ kubectl_version_url }}/{{ item }}"
    dest: "{{ kubectl_install_dir }}/{{ kubectl_version }}/{{ item }}"
    checksum: "{{ kubectl_checksums[item] | default('sha256:' ~ kubectl_version_url ~ '/' ~ item ~ '.sha256') }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ kubectl_binaries }}"
  tags: [kubectl]

# Plain symlinks: only Ansible changes the active version. Older versions stay on disk.
- name: Kubectl | Link the binaries to {{ kubectl_version }}
  ansible.builtin.file:
    src: "{{ kubectl_install_dir }}/{{ kubectl_version }}/{{ item }}"
    dest: "{{ kubectl_bin_dir }}/{{ item }}"
    state: link
    force: true
  loop: "{{ kubectl_binaries }}"
  tags: [kubectl]

- name: Kubectl | Check the installed version
  ansible.builtin.command:
    argv: ["{{ kubectl_bin_dir }}/kubectl", version, --client, -o, json]
  register: kubectl_client
  changed_when: false
  failed_when: >-
    kubectl_client.rc != 0
    or (kubectl_client.stdout | from_json).clientVersion.gitVersion != kubectl_version
  check_mode: false
  when: not ansible_check_mode
  tags: [kubectl]

- name: Kubectl | Bash completion
  when: kubectl_bash_completion | bool
  tags: [kubectl]
  block:
    - name: Kubectl | Install bash-completion
      ansible.builtin.dnf:
        name: bash-completion
        state: present

    - name: Kubectl | Generate the completion script
      ansible.builtin.command:
        argv: ["{{ kubectl_bin_dir }}/kubectl", completion, bash]
      register: kubectl_completion
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Kubectl | Install the completion script
      ansible.builtin.copy:
        content: "{{ kubectl_completion.stdout }}\n"
        dest: /etc/bash_completion.d/kubectl
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode
