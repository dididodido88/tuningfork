---
# The mirror's manifest.yml (bundle/build-bundle.sh) must list every artifact of siem_versions.yml
# with the same version and sha256. Catches a bundle copied to the wrong place or a stale mirror.
- name: Artifacts | Read the mirror manifest
  ansible.builtin.uri:
    url: "{{ siem_mirror_url }}/manifest.yml"
    return_content: true
  register: siem_artifacts_manifest
  delegate_to: "{{ siem_artifacts_manifest_from | default(inventory_hostname) }}"
  run_once: true
  check_mode: false

- name: Artifacts | Check every artifact matches the manifest
  ansible.builtin.assert:
    that: siem_artifacts_manifest_diff | length == 0
    fail_msg: >-
      These artifacts differ between siem_versions.yml and {{ siem_mirror_url }}/manifest.yml
      (version or sha256, or missing from the manifest): {{ siem_artifacts_manifest_diff }}
    success_msg: "All {{ siem_artifacts | length }} artifacts match the mirror manifest."
  run_once: true
  vars:
    siem_artifacts_manifest_by_key: >-
      {{ (siem_artifacts_manifest.content | from_yaml).artifacts | items2dict(key_name='artifact', value_name='sha256') }}
    siem_artifacts_manifest_versions: >-
      {{ (siem_artifacts_manifest.content | from_yaml).artifacts | items2dict(key_name='artifact', value_name='version') }}
    siem_artifacts_manifest_diff: >-
      {%- set out = [] -%}
      {%- for k, v in siem_artifacts.items() -%}
      {%-   if (siem_artifacts_manifest_by_key[k] | default('') | lower) != (v.sha256 | lower)
             or (siem_artifacts_manifest_versions[k] | default('') | string) != (v.version | string) -%}
      {%-     set _ = out.append(k) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
