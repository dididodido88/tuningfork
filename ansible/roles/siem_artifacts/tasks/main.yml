---
# Entry point: resolve siem_artifacts_required against the manifest (siem_versions.yml), check the
# names and checksums, then download and check on Linux or Windows. Returns siem_artifact_paths.
- name: Artifacts | Resolve the artifact list
  ansible.builtin.set_fact:
    siem_artifacts_keys: >-
      {{ (siem_artifacts | default({})).keys() | list
         if siem_artifacts_required == 'all' else siem_artifacts_required }}
  tags: [siem_artifacts]

# Path of each requested artifact below siem_mirror_url (and below the local cache).
- name: Artifacts | Work out the mirror paths
  ansible.builtin.set_fact:
    siem_artifacts_rel_paths: >-
      {%- set ns = namespace(d={}) -%}
      {%- for k in siem_artifacts_keys if k in (siem_artifacts | default({})) -%}
      {%-   set ns.d = ns.d | combine({k: siem_artifacts[k].path | regex_replace('^/+', '')}) -%}
      {%- endfor -%}
      {{ ns.d }}
  tags: [siem_artifacts]

- name: Artifacts | Check the mirror URL, the artifact names and their checksums
  ansible.builtin.assert:
    that:
      - (siem_mirror_url | default('')) is match('^https://')
      - siem_artifacts_keys | difference((siem_artifacts | default({})).keys() | list) | length == 0
      - siem_artifacts_unpinned | length == 0
    fail_msg: >-
      {% if (siem_mirror_url | default('')) is not match('^https://') -%}
      siem_mirror_url must be an https URL (env_repo_base_url in inventories/<ENV>/group_vars/all/main.yml).
      {%- elif siem_artifacts_keys | difference((siem_artifacts | default({})).keys() | list) | length > 0 -%}
      Unknown artifacts: {{ siem_artifacts_keys | difference((siem_artifacts | default({})).keys() | list) }}
      (not in siem_artifacts, inventories/<ENV>/group_vars/all/siem_versions.yml).
      {%- else -%}
      No valid sha256 pinned for: {{ siem_artifacts_unpinned }}. Upload them to the mirror
      and copy their sha256 into siem_versions.yml (docs/siem.md, "Getting the artifacts").
      {%- endif %}
    quiet: true
  vars:
    siem_artifacts_unpinned: >-
      {{ siem_artifacts_keys | select('in', (siem_artifacts | default({})).keys() | list)
         | map('extract', siem_artifacts) | rejectattr('sha256', 'match', '^[0-9a-fA-F]{64}$')
         | map(attribute='path') | list }}
  tags: [siem_artifacts]

- name: Artifacts | Download and check (Linux)
  ansible.builtin.include_tasks: linux.yml
  when:
    - siem_artifacts_keys | length > 0
    - ansible_connection | default('ssh') not in ['winrm', 'psrp']
  tags: [siem_artifacts]

- name: Artifacts | Download and check (Windows)
  ansible.builtin.include_tasks: windows.yml
  when:
    - siem_artifacts_keys | length > 0
    - ansible_connection | default('ssh') in ['winrm', 'psrp']
  tags: [siem_artifacts]
