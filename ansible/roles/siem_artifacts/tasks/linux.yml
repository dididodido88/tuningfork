---
# Linux targets: download each artifact into the cache and check its sha256. Python 3.12+ targets
# (Proxmox VE 9) use curl (curl_one.yml), because get_url fails there.
- name: Artifacts | Create the cache directories
  ansible.builtin.file:
    path: "{{ siem_artifacts_cache_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ siem_artifacts_rel_paths.values() | map('dirname') | unique | list }}"

# get_url with checksum: an existing file with the right checksum isn't downloaded again; a
# download that doesn't match fails and leaves nothing behind.
- name: Artifacts | Download and check each artifact
  ansible.builtin.get_url:
    url: "{{ siem_mirror_url }}/{{ siem_artifacts_rel_paths[item] }}"
    dest: "{{ siem_artifacts_cache_dir }}/{{ siem_artifacts_rel_paths[item] }}"
    checksum: "sha256:{{ siem_artifacts[item].sha256 | lower }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 600
  loop: "{{ siem_artifacts_keys }}"
  when: not siem_artifacts_use_curl | bool

# ansible-core 2.14's get_url fails on Python 3.12+ targets (Proxmox VE 9 / Debian 13): it passes
# cert_file, which Python 3.12 removed. There, curl downloads and the sha256 is checked the same way.
- name: Artifacts | Download and check each artifact with curl (Python 3.12+ target)
  ansible.builtin.include_tasks: curl_one.yml
  loop: "{{ siem_artifacts_keys }}"
  loop_control:
    loop_var: siem_artifact_key
  vars:
    siem_curl_dest: "{{ siem_artifacts_cache_dir }}/{{ siem_artifacts_rel_paths[siem_artifact_key] }}"
    siem_curl_url: "{{ siem_mirror_url }}/{{ siem_artifacts_rel_paths[siem_artifact_key] }}"
    siem_curl_sha256: "{{ siem_artifacts[siem_artifact_key].sha256 | lower }}"
  when: siem_artifacts_use_curl | bool

- name: Artifacts | Record the checked local paths
  ansible.builtin.set_fact:
    siem_artifact_paths: >-
      {%- set ns = namespace(d=siem_artifact_paths | default({})) -%}
      {%- for k in siem_artifacts_keys -%}
      {%-   set ns.d = ns.d | combine({k: siem_artifacts_cache_dir ~ '/' ~ siem_artifacts_rel_paths[k]}) -%}
      {%- endfor -%}
      {{ ns.d }}
