---
# Wazuh central components on the SIEM VM: indexer, manager (with Filebeat) and dashboard,
# installed with Wazuh's offline all-in-one method (wazuh-install.sh -a -of) from the checked
# artifacts (roles/siem_artifacts). Guide: docs/siem.md.
#
# Set per environment in inventories/<ENV>/group_vars/siem_servers.yml; secrets (vault_wazuh_*)
# in inventories/<ENV>/group_vars/all/vault.yml.
#
# Installation runs once. A host where the components are already installed at wazuh_version
# is left alone; a partial installation or another version stops the play (an upgrade is a
# separate procedure: docs/siem.md, "Updating a version"). The installer's -o (overwrite)
# erases all Wazuh data: it is passed only on a host with no Wazuh package whose Wazuh folders
# are empty (the data-disk mount points), where the installer needs it and there is nothing to erase.

# Artifacts this role needs (keys of siem_artifacts in siem_versions.yml).
wazuh_server_artifacts: [wazuh_install_script, wazuh_offline, wazuh_passwords_tool, wazuh_vd_feed]

# The installer runs here and leaves wazuh-install-files.tar (Wazuh's internal certificates and
# the generated passwords). root only.
wazuh_server_work_dir: /var/lib/tuningfork/wazuh

# Seconds the installation may take before the play gives up on it.
wazuh_server_install_timeout: 3600

# Packages the offline installer expects to find already installed (from the mirrored Rocky repos);
# its own lists, minus curl: Rocky 9 has curl-minimal, which the installer accepts.
wazuh_server_prerequisites: [tar, coreutils, grep, sed, gawk, procps-ng, libcap, gnupg2, openssl, lsof]

# Wazuh indexer JVM heap (-Xms and -Xmx), e.g. 4g. At most half the RAM, as the manager, the
# dashboard and the monitoring stack share the VM.
wazuh_server_indexer_heap: 4g

# Indexer temporary folder (OPENSEARCH_TMPDIR). Must be on a filesystem without noexec: /tmp
# has noexec (CIS). The default is on the indexer's data disk.
wazuh_server_indexer_tmpdir: /var/lib/wazuh-indexer/tmp

# --- Passwords --------------------------------------------------------------------------------
# Set from the vault right after installation, replacing the generated ones:
#   admin  Wazuh dashboard and indexer login (break-glass administrator; Filebeat uses it too)
#   wazuh  Wazuh server API administrator
# Wazuh accepts 8 to 64 characters from A-Z a-z 0-9 . * + ? - with at least one upper-case
# letter, one lower-case letter, one digit and one symbol.
wazuh_server_admin_password: "{{ vault_wazuh_indexer_admin_password | default('') }}"
wazuh_server_api_password: "{{ vault_wazuh_api_password | default('') }}"

# --- Manager (ossec.conf, templated from Wazuh 4.14's default) ----------------------------------
# Agents enroll with this password (authd.pass). Set vault_wazuh_enrollment_password.
wazuh_server_enrollment_password: "{{ vault_wazuh_enrollment_password | default('') }}"

# Email through the local Postfix relay (roles/postfix_relay), best effort. Off while
# wazuh_server_email_to is empty.
wazuh_server_email_to: "{{ siem_mail_to | default([]) }}"
wazuh_server_email_from: "{{ siem_mail_from | default('wazuh@' ~ env_domain) }}"
wazuh_server_email_alert_level: 10
wazuh_server_email_maxperhour: 12

# Keep every event received in /var/ossec/logs/archives (not only those matching a rule).
wazuh_server_logall_json: true

# Vulnerability detection reads the feed snapshot from siem_versions.yml (wazuh_vd_feed) from
# this file instead of downloading it.
wazuh_server_vd_feed_path: /var/ossec/var/offline/vd-feed.zip

# The server API listens on this address only (the dashboard reaches it on 127.0.0.1).
wazuh_server_api_host: 127.0.0.1

# Other log files the manager reads on this host (log_format: syslog unless given). The received
# syslog (roles/syslog_receiver) and SNMP traps (roles/snmp_trap_receiver) are under
# /var/log/remote.
wazuh_server_localfiles:
  - location: /var/log/remote/*/*.log
    log_format: syslog

# --- Dashboard --------------------------------------------------------------------------------
# https://<siem_server_name>/ with the host certificate from roles/certificates, so browsers
# that trust the internal CA trust the dashboard. The certificate must cover siem_server_name.
wazuh_server_dashboard_port: 443
wazuh_server_dashboard_certificate: /etc/pki/tls/certs/host.fullchain.crt
wazuh_server_dashboard_key: /etc/pki/tls/private/host.key

# --- Firewall (firewalld) ---------------------------------------------------------------------
# The indexer (9200) and the API (55000) stay closed: they are used from this host only.
wazuh_server_manage_firewall: true
wazuh_server_firewall_zone: "{{ rhel9cis_default_zone | default('public') }}"
# Dashboard (wazuh_server_dashboard_port/tcp).
wazuh_server_admin_networks: "{{ siem_admin_networks | default([]) }}"
# Agent connection (1514/tcp) and enrollment (1515/tcp).
wazuh_server_agent_networks: "{{ siem_agent_networks | default([]) }}"
