---
# Names what is wrong without ever printing a password.
- name: Wazuh | Check the passwords and settings
  ansible.builtin.assert:
    that: wazuh_server_problems | length == 0
    fail_msg: "{{ wazuh_server_problems | join(' | ') }}"
    quiet: true
  vars:
    wazuh_server_problems: >-
      {%- set p = [] -%}
      {%- for key, pw in [('vault_wazuh_indexer_admin_password', wazuh_server_admin_password),
                          ('vault_wazuh_api_password', wazuh_server_api_password)] -%}
      {%-   set why = [] -%}
      {%-   if pw | length == 0 -%}
      {%-     set _ = why.append('not set in group_vars/all/vault.yml') -%}
      {%-   else -%}
      {%-     if pw | length < 8 or pw | length > 64 -%}{%- set _ = why.append('length must be 8 to 64') -%}{%- endif -%}
      {%-     if pw is not search('[A-Z]') -%}{%- set _ = why.append('no upper-case letter') -%}{%- endif -%}
      {%-     if pw is not search('[a-z]') -%}{%- set _ = why.append('no lower-case letter') -%}{%- endif -%}
      {%-     if pw is not search('[0-9]') -%}{%- set _ = why.append('no digit') -%}{%- endif -%}
      {%-     if pw is not search('[.*+?-]') -%}{%- set _ = why.append('no symbol from . * + ? -') -%}{%- endif -%}
      {%-     if pw is search('[^A-Za-z0-9.*+?-]') -%}
      {%-       set _ = why.append('has characters Wazuh does not accept (only A-Z a-z 0-9 . * + ? -)') -%}
      {%-     endif -%}
      {%-   endif -%}
      {%-   if why -%}{%- set _ = p.append(key ~ ': ' ~ (why | join(', '))) -%}{%- endif -%}
      {%- endfor -%}
      {%- if wazuh_server_indexer_heap is not match('^[0-9]+[mg]$') -%}
      {%-   set _ = p.append('wazuh_server_indexer_heap must look like 4g') -%}
      {%- endif -%}
      {%- if siem_server_name | default('') | length == 0 -%}
      {%-   set _ = p.append('siem_server_name is not set in group_vars/all/siem.yml') -%}
      {%- endif -%}
      {{ p }}

- name: Wazuh | Check the firewall networks
  ansible.builtin.assert:
    that:
      - wazuh_server_admin_networks | length > 0
      - wazuh_server_agent_networks | length > 0
    fail_msg: Set siem_admin_networks and siem_agent_networks in group_vars/all/siem.yml.
    quiet: true
  when: wazuh_server_manage_firewall | bool

- name: Wazuh | Check the dashboard certificate and key are in place (playbooks/certificates.yml)
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ wazuh_server_dashboard_certificate }}"
    - "{{ wazuh_server_dashboard_key }}"
  register: wazuh_server_tls_files

- name: Wazuh | Stop if the certificate or key is missing
  ansible.builtin.assert:
    that: wazuh_server_tls_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Missing {{ wazuh_server_tls_files.results | rejectattr('stat.exists') | map(attribute='item') | list }}.
      Run playbooks/certificates.yml for this host first (its certificate must cover {{ siem_server_name }}).
    quiet: true

- name: Wazuh | Install the installer's prerequisites
  ansible.builtin.dnf:
    name: "{{ wazuh_server_prerequisites }}"
    state: present
