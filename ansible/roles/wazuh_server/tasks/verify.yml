---
# After a run: services, manager daemons, API, indexer cluster health and dashboard certificate.
- name: Wazuh | Check the services are running
  ansible.builtin.command:
    argv: "{{ ['systemctl', 'is-active'] + wazuh_server_services }}"
  register: wazuh_server_active
  changed_when: false
  failed_when: wazuh_server_active.rc != 0
  check_mode: false

# wazuh-control prints "<daemon> is running..." or "<daemon> not running..." per daemon.
- name: Wazuh | Check the manager's daemons
  ansible.builtin.command: /var/ossec/bin/wazuh-control status
  register: wazuh_server_daemons
  changed_when: false
  failed_when: wazuh_server_daemons.stdout_lines | select('search', 'not running') | reject('search', wazuh_server_daemons_optional) | list | length > 0
  check_mode: false
  vars:
    # Off in this configuration (cluster, agentless, client buffer, integrations, Docker, CSyslog, maild without email).
    wazuh_server_daemons_optional: "wazuh-clusterd|wazuh-agentlessd|wazuh-integratord|wazuh-dbd|wazuh-csyslogd|wazuh-maild"

# After a restart the API takes a moment to come back.
- name: Wazuh | Check the server API answers on {{ wazuh_server_api_host }}
  ansible.builtin.uri:
    url: "https://{{ wazuh_server_api_host }}:55000/security/user/authenticate"
    method: POST
    user: wazuh
    password: "{{ wazuh_server_api_password }}"
    force_basic_auth: true
    validate_certs: false
  register: wazuh_server_api_final
  until: wazuh_server_api_final.status == 200
  retries: 18
  delay: 10
  no_log: true

- name: Wazuh | Check the indexer cluster health
  ansible.builtin.uri:
    url: https://127.0.0.1:9200/_cluster/health
    user: admin
    password: "{{ wazuh_server_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: wazuh_server_health
  until: wazuh_server_health.json.status | default('') in ['green', 'yellow']
  retries: 30
  delay: 10
  no_log: true

# Through the name browsers use, checked against the system trust store (internal CA).
- name: Wazuh | Check the dashboard answers with the host certificate
  ansible.builtin.uri:
    url: "https://{{ siem_server_name }}{{ '' if wazuh_server_dashboard_port | int == 443 else ':' ~ wazuh_server_dashboard_port }}/"
    status_code: [200, 302]
    follow_redirects: none
  register: wazuh_server_dashboard_check
  until: wazuh_server_dashboard_check.status in [200, 302]
  retries: 30
  delay: 10

- name: Wazuh | Report
  ansible.builtin.debug:
    msg: >-
      Wazuh {{ wazuh_version }} running: indexer cluster {{ wazuh_server_health.json.status }},
      dashboard https://{{ siem_server_name }}{{ '' if wazuh_server_dashboard_port | int == 443 else ':' ~ wazuh_server_dashboard_port }}/
      (log in as admin with vault_wazuh_indexer_admin_password).
