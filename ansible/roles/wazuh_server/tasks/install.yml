---
- name: Wazuh | Check which central components are installed
  ansible.builtin.command:
    argv: [rpm, -q, --qf, '%{NAME} %{VERSION}\n', wazuh-manager, wazuh-indexer, wazuh-dashboard]
  register: wazuh_server_rpm
  changed_when: false
  failed_when: false
  check_mode: false

# name -> version of the components that are installed ("package ... is not installed" lines are skipped).
- name: Wazuh | Record the installed versions
  ansible.builtin.set_fact:
    wazuh_server_installed: >-
      {%- set ns = namespace(d={}) -%}
      {%- for line in wazuh_server_rpm.stdout_lines if line is match('^wazuh-(manager|indexer|dashboard) \S+$') -%}
      {%-   set ns.d = ns.d | combine({line.split(' ')[0]: line.split(' ')[1]}) -%}
      {%- endfor -%}
      {{ ns.d }}

- name: Wazuh | Stop on a partial installation or another version
  ansible.builtin.assert:
    that: >-
      wazuh_server_installed | length == 0 or
      (wazuh_server_installed | length == wazuh_server_packages | length and
       wazuh_server_installed.values() | unique | list == [wazuh_version | string])
    fail_msg: >-
      Found {{ wazuh_server_installed }}, expected none or all of {{ wazuh_server_packages }} at
      {{ wazuh_version }}. This role installs once and never overwrites (that erases all Wazuh data).
      For an upgrade see docs/siem.md, "Updating a version".
    quiet: true

- name: Wazuh | Create the working directory
  ansible.builtin.file:
    path: "{{ wazuh_server_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# The scripts are copied, not linked: the installer resolves its own folder through a symlink
# (and looks there for what it unpacked into the current folder), and it rewrites itself.
- name: Wazuh | Copy the password tool into the working directory
  ansible.builtin.copy:
    src: "{{ siem_artifact_paths['wazuh_passwords_tool'] }}"
    dest: "{{ wazuh_server_work_dir }}/wazuh-passwords-tool.sh"
    remote_src: true
    owner: root
    group: root
    mode: "0700"

# Only for an installation, as the installer changes its own copy when it runs.
- name: Wazuh | Copy the installer into the working directory
  ansible.builtin.copy:
    src: "{{ siem_artifact_paths['wazuh_install_script'] }}"
    dest: "{{ wazuh_server_work_dir }}/wazuh-install.sh"
    remote_src: true
    owner: root
    group: root
    mode: "0700"
  when: wazuh_server_installed | length == 0

# The installer opens the archive by name in the current folder; a link saves copying 1.7 GB.
- name: Wazuh | Link the offline package archive into the working directory
  ansible.builtin.file:
    src: "{{ siem_artifact_paths['wazuh_offline'] }}"
    dest: "{{ wazuh_server_work_dir }}/wazuh-offline.tar.gz"
    state: link
    force: true

# The installer skips unpacking when wazuh-offline/ exists; unpack fresh from the checked archive.
- name: Wazuh | Remove packages unpacked by an earlier attempt
  ansible.builtin.file:
    path: "{{ wazuh_server_work_dir }}/wazuh-offline"
    state: absent
  when: wazuh_server_installed | length == 0

# The installer refuses to run while any of its folders exists, even empty, and the data-disk
# mount points always exist. Its -o then only runs rm -rf on those folders. So -o is passed
# only on a host with no Wazuh package and nothing in those folders (lost+found aside): there
# is no data for it to erase. Anything found there stops the play instead.
- name: Wazuh | Find the installer's folders that exist
  ansible.builtin.command:
    argv: "{{ ['find'] + wazuh_server_install_dirs + ['-maxdepth', '0', '-type', 'd'] }}"
  register: wazuh_server_dirs_present
  changed_when: false
  failed_when: false
  check_mode: false
  when: wazuh_server_installed | length == 0

- name: Wazuh | Look for files in those folders
  ansible.builtin.command:
    argv: "{{ ['find'] + wazuh_server_dirs_present.stdout_lines + ['-mindepth', '1', '-maxdepth', '1', '!', '-name', 'lost+found'] }}"
  register: wazuh_server_dirs_content
  changed_when: false
  check_mode: false
  when:
    - wazuh_server_installed | length == 0
    - wazuh_server_dirs_present.stdout_lines | default([]) | length > 0

- name: Wazuh | Stop if a folder holds files from an earlier installation
  ansible.builtin.assert:
    that: wazuh_server_dirs_content.stdout_lines | default([]) | length == 0
    fail_msg: >-
      No Wazuh package is installed, but these exist: {{ wazuh_server_dirs_content.stdout_lines[:20] }}.
      The installer would erase them. Check them, move or delete them by hand, and run again.
    quiet: true
  when: wazuh_server_installed | length == 0

# The installer's summary prints the generated admin password, so the output is hidden; on failure
# the next task shows its last lines without any password line. Full log: /var/log/wazuh-install.log.
- name: Wazuh | Run the offline all-in-one installation (takes several minutes)
  ansible.builtin.command:
    argv: >-
      {{ ['bash', 'wazuh-install.sh', '--offline-installation', '--all-in-one']
         + (['--overwrite'] if wazuh_server_dirs_present.stdout_lines | default([]) | length > 0 else []) }}
    chdir: "{{ wazuh_server_work_dir }}"
  async: "{{ wazuh_server_install_timeout }}"
  poll: 30
  register: wazuh_server_install
  failed_when: false
  changed_when: true
  no_log: true
  when: wazuh_server_installed | length == 0

- name: Wazuh | Stop if the installation failed
  ansible.builtin.fail:
    msg: >-
      wazuh-install.sh failed (rc {{ wazuh_server_install.rc | default('?') }}). Last lines:
      {{ (wazuh_server_install.stdout_lines | default([]) | reject('search', '(?i)passw') | list)[-25:] }}
      Full log on the host: /var/log/wazuh-install.log
  when:
    - wazuh_server_install is not skipped
    - wazuh_server_install.rc | default(1) != 0

# About 1.8 GB on /var, no longer needed once the packages are installed.
- name: Wazuh | Remove the unpacked packages after installation
  ansible.builtin.file:
    path: "{{ wazuh_server_work_dir }}/wazuh-offline"
    state: absent
  when: wazuh_server_install is changed

# Both hold generated passwords.
- name: Wazuh | Restrict the installer's log and files
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - /var/log/wazuh-install.log
    - "{{ wazuh_server_install_files_tar }}"
  failed_when: false
