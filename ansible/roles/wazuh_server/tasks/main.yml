---
 Indexer$| Pre-checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [wazuh_server]

# Downloads from the mirror and checks each sha256 against siem_versions.yml; sets
# siem_artifact_paths (key -> checked local file).
 Indexer$| Download and check the artifacts
  ansible.builtin.include_role:
    name: siem_artifacts
  vars:
    siem_artifacts_required: "{{ wazuh_server_artifacts }}"
  tags: [wazuh_server]

 Indexer$| Indexer
  ansible.builtin.import_tasks: indexer.yml
  tags: [wazuh_server]

 Indexer$| Install
  ansible.builtin.import_tasks: install.yml
  tags: [wazuh_server]

 Indexer$| Passwords
  ansible.builtin.import_tasks: passwords.yml
  tags: [wazuh_server]

 Indexer$| Dashboard
  ansible.builtin.import_tasks: dashboard.yml
  tags: [wazuh_server]

 Indexer$| Firewall
  ansible.builtin.import_tasks: firewall.yml
  when: wazuh_server_manage_firewall | bool
  tags: [wazuh_server, firewall]

 Indexer$| Apply pending restarts
  ansible.builtin.meta: flush_handlers
  tags: [wazuh_server]

 Indexer$| Check
  ansible.builtin.import_tasks: verify.yml
  tags: [wazuh_server]
