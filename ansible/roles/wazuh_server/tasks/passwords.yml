---
# Each password is changed with Wazuh's own tool, and only when the vault password doesn't log in
# yet, so later runs change nothing. Both endpoints are on this host (loopback) and use Wazuh's
# internal certificates, hence no certificate check.

# --- admin: indexer and dashboard ---------------------------------------------------------------
- name: Wazuh | Try the vault admin password on the indexer
  ansible.builtin.uri:
    url: https://127.0.0.1:9200/
    user: admin
    password: "{{ wazuh_server_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: wazuh_server_admin_login
  until: wazuh_server_admin_login.status in [200, 401]
  retries: 30
  delay: 10
  no_log: true

# Also updates the password Filebeat uses to send alerts to the indexer.
- name: Wazuh | Set the admin password from the vault
  ansible.builtin.command:
    argv:
      - bash
      - "{{ wazuh_server_work_dir }}/wazuh-passwords-tool.sh"
      - --user
      - admin
      - --password
      - "{{ wazuh_server_admin_password }}"
  changed_when: true
  no_log: true
  register: wazuh_server_admin_change
  when: wazuh_server_admin_login.status == 401

- name: Wazuh | Check the vault admin password now logs in  # noqa: no-handler
  ansible.builtin.uri:
    url: https://127.0.0.1:9200/
    user: admin
    password: "{{ wazuh_server_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: wazuh_server_admin_recheck
  until: wazuh_server_admin_recheck.status == 200
  retries: 12
  delay: 10
  no_log: true
  when: wazuh_server_admin_change is changed

# --- wazuh: server API ----------------------------------------------------------------------------
- name: Wazuh | Try the vault API password
  ansible.builtin.uri:
    url: https://127.0.0.1:55000/security/user/authenticate
    method: POST
    user: wazuh
    password: "{{ wazuh_server_api_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: wazuh_server_api_login
  until: wazuh_server_api_login.status in [200, 401]
  retries: 30
  delay: 10
  no_log: true

# The tool needs the current API password: the generated one, kept in wazuh-install-files.tar.
- name: Wazuh | Read the generated passwords  # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: [tar, -xOf, "{{ wazuh_server_install_files_tar }}", wazuh-install-files/wazuh-passwords.txt]
  register: wazuh_server_generated
  changed_when: false
  no_log: true
  when: wazuh_server_api_login.status == 401

- name: Wazuh | Find the generated API password
  ansible.builtin.set_fact:
    wazuh_server_api_generated: >-
      {{ wazuh_server_generated.stdout | regex_findall(wazuh_server_api_password_re) | first | default('') }}
  vars:
    wazuh_server_api_password_re: "api_username: 'wazuh'\\s+api_password: '([^']+)'"
  no_log: true
  when: wazuh_server_api_login.status == 401

- name: Wazuh | Stop if the generated API password wasn't found
  ansible.builtin.assert:
    that: wazuh_server_api_generated | length > 0
    fail_msg: >-
      The vault API password doesn't log in, and the generated one wasn't found in
      {{ wazuh_server_install_files_tar }} (wazuh-install-files/wazuh-passwords.txt). If the API password was
      changed by hand, set vault_wazuh_api_password to it.
    quiet: true
  when: wazuh_server_api_login.status == 401

- name: Wazuh | Set the API password from the vault
  ansible.builtin.command:
    argv:
      - bash
      - "{{ wazuh_server_work_dir }}/wazuh-passwords-tool.sh"
      - --api
      - --admin-user
      - wazuh
      - --admin-password
      - "{{ wazuh_server_api_generated }}"
      - --user
      - wazuh
      - --password
      - "{{ wazuh_server_api_password }}"
  changed_when: true
  no_log: true
  register: wazuh_server_api_change
  when: wazuh_server_api_login.status == 401

- name: Wazuh | Check the vault API password now logs in  # noqa: no-handler
  ansible.builtin.uri:
    url: https://127.0.0.1:55000/security/user/authenticate
    method: POST
    user: wazuh
    password: "{{ wazuh_server_api_password }}"
    force_basic_auth: true
    validate_certs: false
  register: wazuh_server_api_recheck
  until: wazuh_server_api_recheck.status == 200
  retries: 12
  delay: 10
  no_log: true
  when: wazuh_server_api_change is changed
