---
# RKE2 server nodes: control plane, etcd and workloads on every node. RKE2 is installed from the
# pre-downloaded artifacts on the mirror with RKE2's install.sh, and every image is pulled from
# the private registry (Harbor). One cluster per inventory group. Guide: docs/rancher.md.
#
# Set per cluster in inventories/<ENV>/group_vars/<cluster group>.yml (the Rancher cluster:
# rke2_rancher.yml). The CIS exceptions RKE2 needs are in playbooks/group_vars/rke2_servers.yml.

# Inventory group that forms this cluster. Its first host, sorted by name, creates the cluster;
# the others join it through rke2_registration_host.
rke2_cluster_group: ""
# Number of nodes a cluster may have (etcd needs an odd number).
rke2_allowed_server_counts: [1, 3]
# Short name of the cluster: names the kubeconfig copied to the control node.
rke2_cluster_name: "{{ rke2_cluster_group }}"

# --- Version and artifacts ----------------------------------------------------------------------
# Required, e.g. v1.33.5+rke2r1.
rke2_version: ""
# The mirror holds, for each version:
#   <rke2_mirror_url>/<rke2_version>/install.sh
#   <rke2_mirror_url>/<rke2_version>/rke2.linux-amd64.tar.gz
#   <rke2_mirror_url>/<rke2_version>/sha256sum-amd64.txt     (checks the tarball)
rke2_mirror_url: "{{ env_repo_base_url | default('') }}/rke2"
rke2_version_url: "{{ rke2_mirror_url }}/{{ rke2_version }}"
# Required: "sha256:<hash>" of install.sh (it has no published checksum), recorded when downloaded.
rke2_install_sh_checksum: ""
# Required: SELinux policy for RKE2, at <rke2_mirror_url>/rke2-selinux/<rke2_selinux_rpm>, and its
# "sha256:<hash>".
rke2_selinux_rpm: ""
rke2_selinux_checksum: ""
# Where the artifacts are kept on the node (on the /var/lib/rancher data disk).
rke2_artifacts_dir: /var/lib/rancher/rke2-artifacts

# --- Cluster ------------------------------------------------------------------------------------
# Required: join secret shared by every node of the cluster (from the vault).
rke2_token: ""
# Fixed registration address: nodes after the first join https://<this>:9345, through the load
# balancer. Required.
rke2_registration_host: ""
# Virtual IP behind rke2_registration_host. When set, the pre-check makes sure the name resolves to it.
rke2_registration_vip: ""
# Names and addresses the Kubernetes API certificate covers, besides the node's own.
rke2_tls_san: []
rke2_cluster_cidr: 10.42.0.0/16
rke2_service_cidr: 10.43.0.0/16
# etcd snapshots, kept in /var/lib/rancher/rke2/server/db/snapshots: every 6 hours, 28 kept (7 days).
rke2_etcd_snapshot_schedule: "0 */6 * * *"
rke2_etcd_snapshot_retention: 28
# More settings for /etc/rancher/rke2/config.yaml (RKE2 server options), e.g. {kube-apiserver-arg: [...]}.
rke2_config_extra: {}

# --- Images -------------------------------------------------------------------------------------
# Every system image is pulled from <rke2_registry>/rancher/... (system-default-registry), and
# docker.io is mirrored to it. The project rancher is private: the nodes log in as a Harbor robot.
rke2_registry: "registry.{{ env_domain | default('') }}"
rke2_registry_username: "robot$k8s-pull"
rke2_registry_password: "{{ (vault_harbor_robot_secrets | default({}))['k8s-pull'] | default('') }}"
# The system trust store, which holds the internal CA that signed Harbor's certificate.
rke2_registry_ca_file: /etc/pki/tls/certs/ca-bundle.crt

# --- Host ---------------------------------------------------------------------------------------
# Each must be its own mounted filesystem (a data disk from Terraform, mounted by roles/filesystems).
# The play stops before installing if one isn't.
rke2_required_mounts: [/var/lib/rancher, /var/lib/kubelet]
# Stop and mask firewalld (RKE2's documented setup; see playbooks/group_vars/rke2_servers.yml).
rke2_disable_firewalld: true
rke2_packages: [container-selinux, tar]
# Seconds to wait for rke2-server to start and for the node to be Ready.
rke2_start_timeout: 1800
rke2_ready_timeout: 600

# --- Kubeconfig on the control node -----------------------------------------------------------
# The first node's admin kubeconfig, with the server set to https://<rke2_registration_host>:6443.
# It holds cluster-admin credentials: kept 0600 and outside the repository.
rke2_kubeconfig_dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/{{ env_name | default('env') }}-{{ rke2_cluster_name }}.yaml"
