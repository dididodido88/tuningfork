---
# Pre-checks for both modes. Nothing is changed until these pass. A standalone cluster has more
# (preflight_standalone.yml).

- name: RKE2 | Check the settings
  ansible.builtin.assert:
    that:
      - rke2_cluster_group | length > 0
      - rke2_cluster_group in groups
      - inventory_hostname in groups[rke2_cluster_group]
      - groups[rke2_cluster_group] | length in rke2_allowed_server_counts
      - rke2_selinux_rpm is match('^rke2-selinux-.+[.]rpm$')
      - rke2_selinux_checksum is match('^sha256:[0-9a-fA-F]{64}$')
      - rke2_registration_host | length > 0
      - rke2_registry_password | length > 0
      - (env_repo_base_url | default('')) is match('^https://')
    fail_msg: >-
      Set in inventories/<ENV>/group_vars/{{ rke2_cluster_group | default('<cluster group>', true) }}.yml:
      rke2_cluster_group (this host must be in it; the cluster has
      {{ groups[rke2_cluster_group] | default([]) | length }} node(s), allowed {{ rke2_allowed_server_counts }}),
      rke2_selinux_rpm and rke2_selinux_checksum (sha256:<hash>), rke2_registration_host. In the
      vault: vault_harbor_robot_secrets['k8s-pull']. Guide: docs/rancher.md.
    quiet: true

# --- RKE2's data on its own disks ----------------------------------------------------------------
- name: RKE2 | Look at the data directories
  ansible.builtin.command:
    argv: [findmnt, -n, -o, SOURCE, --mountpoint, "{{ item }}"]
  loop: "{{ rke2_required_mounts }}"
  register: rke2_mounts
  changed_when: false
  failed_when: false
  check_mode: false

- name: RKE2 | Stop unless each data directory is its own filesystem
  ansible.builtin.assert:
    that: rke2_mounts.results | rejectattr('rc', 'eq', 0) | list | length == 0
    fail_msg: >-
      These aren't mounted filesystems on {{ inventory_hostname }}:
      {{ rke2_mounts.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | join(', ') }}.
      RKE2 keeps its binaries, images, etcd and pod data there, so each needs its own data disk
      (terraform/_envcommon/roles/rke2-*.hcl). Run playbooks/filesystems.yml first (site.yml does).
    quiet: true

# --- Names and services the cluster depends on -------------------------------------------------
- name: RKE2 | Look up the registration name
  ansible.builtin.command:
    argv: [getent, ahostsv4, "{{ rke2_registration_host }}"]
  register: rke2_registration_dns
  changed_when: false
  failed_when: false
  check_mode: false

- name: RKE2 | Check the registration name resolves (to the virtual IP)
  ansible.builtin.assert:
    that:
      - rke2_registration_dns.rc == 0
      - rke2_registration_vip | length == 0 or rke2_registration_vip in rke2_registration_ips
    fail_msg: >-
      {{ rke2_registration_host }} must resolve to the load balancer's virtual IP
      {{ rke2_registration_vip | default('', true) }}; it resolves to [{{ rke2_registration_ips | join(', ') }}].
      Create the DNS A record (docs/rancher.md, "Prerequisites").
    quiet: true
  vars:
    rke2_registration_ips: "{{ rke2_registration_dns.stdout_lines | map('split') | map('first') | unique | list }}"

- name: RKE2 | Check the registry answers
  ansible.builtin.uri:
    url: "https://{{ rke2_registry }}/v2/"
    status_code: [200, 401]
    validate_certs: true
    timeout: 15
  check_mode: false
