---
# The first node's admin kubeconfig, for Terraform (terraform/k8s/<ENV>/rancher-server) and
# administrators on the control node. Its server is the registration name on 6443, through the
# load balancer, so it keeps working when a node is down. It grants cluster-admin: 0600, outside
# the repository, never logged.
- name: RKE2 | Copy the admin kubeconfig to the control node
  when:
    - inventory_hostname == rke2_init_node
    - not ansible_check_mode
  block:
    - name: RKE2 | Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: rke2_admin_kubeconfig
      no_log: true

    - name: RKE2 | Create the kubeconfig directory on the control node
      ansible.builtin.file:
        path: "{{ rke2_kubeconfig_dest | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: RKE2 | Write the kubeconfig on the control node ({{ rke2_kubeconfig_dest }})
      ansible.builtin.copy:
        content: "{{ rke2_kubeconfig | to_nice_yaml(indent=2) }}"
        dest: "{{ rke2_kubeconfig_dest }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      diff: false
      no_log: true
      vars:
        rke2_kubeconfig_source: "{{ rke2_admin_kubeconfig.content | b64decode | from_yaml }}"
        rke2_kubeconfig:
          apiVersion: v1
          kind: Config
          clusters:
            - name: "{{ rke2_cluster_name }}"
              cluster: "{{ rke2_kubeconfig_source.clusters[0].cluster | combine({'server': 'https://' ~ rke2_registration_host ~ ':6443'}) }}"
          users:
            - name: "{{ rke2_cluster_name }}-admin"
              user: "{{ rke2_kubeconfig_source.users[0].user }}"
          contexts:
            - name: "{{ rke2_cluster_name }}"
              context:
                cluster: "{{ rke2_cluster_name }}"
                user: "{{ rke2_cluster_name }}-admin"
          current-context: "{{ rke2_cluster_name }}"
