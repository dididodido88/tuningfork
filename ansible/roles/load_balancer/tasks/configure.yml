---
# HAProxy and keepalived: packages, non-local bind, SELinux port permission, haproxy.cfg and
# keepalived.conf from load_balancer_* (group_vars/lb_*.yml), the haproxy-status command.
- name: LB | Install HAProxy, keepalived and socat
  ansible.builtin.dnf:
    name: "{{ load_balancer_packages }}"
    state: present

# HAProxy binds the virtual IP, which is only on this host while keepalived holds it.
- name: LB | Allow binding addresses this host doesn't hold yet
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: "1"
    sysctl_file: /etc/sysctl.d/90-load-balancer.conf
    sysctl_set: true
    state: present

# SELinux: lets HAProxy listen on and connect to 6443, 9345 and 8404 as well as 80/443.
- name: LB | Let HAProxy use any port (SELinux)
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'

# Holds the statistics password.
- name: LB | Write the HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/haproxy -c -f %s
  diff: false
  notify: LB | Reload HAProxy

- name: LB | Write the keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/keepalived --config-test --use-file %s
  notify: LB | Restart keepalived

- name: LB | Install the haproxy-status command
  ansible.builtin.copy:
    src: haproxy-status
    dest: /usr/local/sbin/haproxy-status
    owner: root
    group: root
    mode: "0755"

- name: LB | Start HAProxy and keepalived
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [haproxy, keepalived]

- name: LB | Apply configuration changes
  ansible.builtin.meta: flush_handlers
