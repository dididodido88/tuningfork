---
# Prometheus on the SIEM VM, from the checked release tarball (siem_versions.yml). Scrape jobs
# are built from the inventory; alerts go to the local Alertmanager. Guide: docs/siem.md.

# Local only: administrators look at metrics through Grafana.
prometheus_listen_address: 127.0.0.1:9090

# Time series on the SIEM VM's /var/lib/prometheus data disk. Data is deleted when either
# limit is reached; keep the size below the disk size (group_vars/siem_servers.yml).
prometheus_data_dir: /var/lib/prometheus
prometheus_retention_time: 90d
prometheus_retention_size: 30GB

prometheus_scrape_interval: 60s
prometheus_evaluation_interval: 60s

prometheus_alertmanager: 127.0.0.1:9093

prometheus_user: prometheus

# iDRACs through snmp_exporter (module dell): only once the SNMPv3 user and passwords are set
# (roles/snmp_exporter), so the iDRACs don't show as down before they are configured.
prometheus_idrac_enabled: >-
  {{ (groups['idrac'] | default([])) | length > 0
     and (siem_idrac_snmp_username | default('')) | length > 0
     and (vault_snmp_idrac_auth_password | default('')) | length > 0
     and (vault_snmp_idrac_priv_password | default('')) | length > 0 }}
prometheus_snmp_exporter: 127.0.0.1:9116
# The dell module walks large tables (event and Lifecycle logs): allow most of the interval.
prometheus_idrac_scrape_timeout: 50s

# Proxmox through pve_exporter: only once the API token is in the vault (roles/pve_exporter).
prometheus_pve_enabled: >-
  {{ (groups['proxmox_hosts'] | default([])) | length > 0
     and (vault_pve_exporter_token_value | default('')) | length > 0 }}
prometheus_pve_exporter: 127.0.0.1:9221
