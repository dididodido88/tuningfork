---
wazuh_agent_artifact: "{{ 'wazuh_agent_rpm' if ansible_os_family == 'RedHat' else 'wazuh_agent_deb' }}"

# Installed agent version ('' when absent), from package_facts, without a Debian revision (-1).
wazuh_agent_installed: "{{ ((ansible_facts.packages['wazuh-agent'] | default([{}]))[0].version | default('') | string).split('-')[0] }}"

wazuh_agent_install_env:
  WAZUH_MANAGER: "{{ wazuh_agent_manager }}"
  WAZUH_REGISTRATION_PASSWORD: "{{ wazuh_agent_enrollment_password }}"
  WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"
  WAZUH_AGENT_NAME: "{{ wazuh_agent_name }}"
