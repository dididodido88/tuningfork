---
- name: NTP | Restart chronyd
  ansible.builtin.systemd:
    name: "{{ linux_common_ntp_service }}"
    state: restarted

- name: Journald | Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

- name: Journald | Flush journal to disk
  ansible.builtin.command: journalctl --flush
  changed_when: true
