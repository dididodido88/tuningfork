---
- name: NAS | Install packages
  ansible.builtin.dnf:
    name: "{{ nas_server_packages }}"
    state: present
  tags: [nas_server]

- name: NAS | Create export directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nas_server_exports }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [nas_server]

- name: NAS | Write /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: NAS | Re-export NFS shares
  tags: [nas_server]

- name: NAS | Enable and start nfs-server
  ansible.builtin.systemd:
    name: nfs-server
    enabled: true
    state: started
  tags: [nas_server]

- name: NAS | Open the firewall
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ nas_server_firewall_services }}"
  when: nas_server_manage_firewall | bool
  tags: [nas_server, firewall]
