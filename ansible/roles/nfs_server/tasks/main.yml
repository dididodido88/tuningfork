---
- name: NFS | Install packages
  ansible.builtin.package:
    name: "{{ nfs_server_packages }}"
    state: present
  tags: [nfs_server]

- name: NFS | Create export directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ nfs_server_exports }}"
  loop_control:
    label: "{{ item.path }}"
  tags: [nfs_server]

- name: NFS | Write /etc/exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Re-export NFS shares
  tags: [nfs_server]

- name: NFS | Enable and start nfs-server
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true
  tags: [nfs_server]

- name: NFS | Open firewalld services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ nfs_server_firewalld_services }}"
  when: nfs_server_manage_firewall | bool
  tags: [nfs_server, firewall]
