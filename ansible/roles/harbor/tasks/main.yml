---
# Harbor, in order: pre-checks, Docker, installer (first run or reconfigure), then the API setup
# (LDAP, projects, robots). Settings: group_vars/registry_servers.yml; secrets: vault_harbor_*.
- name: Harbor | Pre-checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [harbor]

- name: Harbor | Docker
  ansible.builtin.import_tasks: docker.yml
  tags: [harbor]

- name: Harbor | Install or reconfigure
  ansible.builtin.import_tasks: install.yml
  tags: [harbor]

- name: Harbor | Initialise through the API
  ansible.builtin.import_tasks: initialise.yml
  tags: [harbor]
