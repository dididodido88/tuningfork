---
- name: Harbor | Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ harbor_install_dir }}/dist"
    - "{{ harbor_install_dir }}/{{ harbor_version }}"
    - "{{ harbor_data_dir }}"
    - "{{ harbor_log_dir }}"

- name: Harbor | Download the offline installer from the mirror
  ansible.builtin.get_url:
    url: "{{ harbor_installer_url }}"
    dest: "{{ harbor_install_dir }}/dist/{{ harbor_installer_file }}"
    checksum: "{{ harbor_installer_checksum }}"
    owner: root
    group: root
    mode: "0644"

- name: Harbor | Unpack the installer
  ansible.builtin.unarchive:
    src: "{{ harbor_install_dir }}/dist/{{ harbor_installer_file }}"
    dest: "{{ harbor_install_dir }}/{{ harbor_version }}"
    remote_src: true
    creates: "{{ harbor_app_dir }}/install.sh"

# Contains the admin and database passwords.
- name: Harbor | Write harbor.yml
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ harbor_app_dir }}/harbor.yml"
    owner: root
    group: root
    mode: "0600"
  register: harbor_config
  diff: false

# Compose merges docker-compose.override.yml automatically; prepare doesn't touch it.
- name: Harbor | Trust the system CA bundle in harbor-core and jobservice
  ansible.builtin.template:
    src: docker-compose.override.yml.j2
    dest: "{{ harbor_app_dir }}/docker-compose.override.yml"
    owner: root
    group: root
    mode: "0644"
  register: harbor_override

- name: Harbor | Install the systemd unit (start in order at boot)
  ansible.builtin.template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    owner: root
    group: root
    mode: "0644"
  register: harbor_unit

- name: Harbor | Run the installer (first installation)
  ansible.builtin.command:
    argv: "{{ ['./install.sh'] + (['--with-trivy'] if harbor_with_trivy | bool else []) }}"
    chdir: "{{ harbor_app_dir }}"
  register: harbor_install
  changed_when: true
  when: harbor_marker.content is not defined

- name: Harbor | Record the installed version
  ansible.builtin.copy:
    content: "{{ harbor_version }}\n"
    dest: "{{ harbor_version_marker }}"
    owner: root
    group: root
    mode: "0644"
  when: harbor_install is changed

# Existing installation, configuration changed: regenerate the component configs and recreate.
- name: Harbor | Regenerate configuration
  ansible.builtin.command:
    argv: "{{ ['./prepare'] + (['--with-trivy'] if harbor_with_trivy | bool else []) }}"
    chdir: "{{ harbor_app_dir }}"
  changed_when: true
  when:
    - harbor_install is skipped
    - harbor_config is changed

- name: Harbor | Recreate the containers
  ansible.builtin.shell: |
    set -e
    docker compose down
    docker compose up -d
  args:
    chdir: "{{ harbor_app_dir }}"
  changed_when: true
  when:
    - harbor_install is skipped
    - harbor_config is changed or harbor_override is changed

- name: Harbor | Enable the systemd unit
  ansible.builtin.systemd:
    name: harbor
    enabled: true
    state: started
    daemon_reload: "{{ harbor_unit is changed }}"
