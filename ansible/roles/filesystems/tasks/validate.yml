---
# Checks every volume before any disk is touched. A disk is used only if it is
# blank, or already carries exactly the partition this role created for this mount
# point (re-runs): one GPT partition, named after the volume, with the volume's
# filesystem type, not mounted anywhere else.

# Volumes come from every filesystems_volumes__* variable, often in different files (Terraform's
# terraform_<unit>.yml, group_vars, host_vars), so the message names the variable each comes from.
- name: Validate | No mount point or disk is listed twice
  vars:
    filesystems_dup_mounts: >-
      {%- set seen = [] -%}{%- set dup = [] -%}
      {%- for x in filesystems_volumes | map(attribute='mount') -%}
      {%-   if x in seen and x not in dup -%}{%- set _ = dup.append(x) -%}{%- endif -%}
      {%-   set _ = seen.append(x) -%}
      {%- endfor -%}
      {{ dup }}
    filesystems_dup_disks: >-
      {%- set seen = [] -%}{%- set dup = [] -%}
      {%- for x in filesystems_volumes | map(attribute='disk') -%}
      {%-   if x in seen and x not in dup -%}{%- set _ = dup.append(x) -%}{%- endif -%}
      {%-   set _ = seen.append(x) -%}
      {%- endfor -%}
      {{ dup }}
  ansible.builtin.assert:
    that:
      - filesystems_dup_mounts | length == 0
      - filesystems_dup_disks | length == 0
    fail_msg: >-
      {% if filesystems_dup_mounts | length > 0 %}Mount points listed more than once:
      {{ filesystems_dup_mounts | join(', ') }}. {% endif %}{% if filesystems_dup_disks | length > 0 %}Disks
      listed more than once: {{ filesystems_dup_disks | join(', ') }}. {% endif %}The volumes come from
      {% for n in query('varnames', '^filesystems_volumes__.+') | sort %}{{ n }}
      ({{ query('vars', n) | flatten | map(attribute='mount') | join(', ') }}){{ '; ' if not loop.last else '.' }}
      {% endfor %}
      Keep each volume in one of them. For a VM built by Terraform that is
      filesystems_volumes__terraform (inventories/<ENV>/terraform_<unit>.yml): remove the others.
    quiet: true

- name: Validate | Filesystem types are supported
  ansible.builtin.assert:
    that: item.fstype in filesystems_supported_fstypes
    fail_msg: "{{ item.mount }}: fstype '{{ item.fstype }}' isn't in filesystems_supported_fstypes {{ filesystems_supported_fstypes }}"
    quiet: true
  loop: "{{ filesystems_volumes }}"
  loop_control:
    label: "{{ item.mount }}"

- name: Validate | Mount options don't cancel CIS options
  ansible.builtin.assert:
    that: >-
      item.cis_opts | map('extract', filesystems_cis_conflicts) | intersect(item.user_opts) | length == 0
    fail_msg: >-
      {{ item.mount }}: mount_opts {{ item.user_opts }} cancel CIS options {{ item.cis_opts }}.
      Remove them, or disable the matching rhel9cis_rule_1_1_2_* rule.
    quiet: true
  loop: "{{ filesystems_volumes }}"
  loop_control:
    label: "{{ item.mount }}"

- name: Validate | /tmp on a disk needs CIS to leave tmp.mount alone
  ansible.builtin.assert:
    that: not (rhel9cis_tmp_svc | default(false) | bool)
    fail_msg: /tmp is defined as a data disk, so rhel9cis_tmp_svc must be false (it would mount tmpfs over it).
    quiet: true
  when: "'/tmp' in filesystems_volumes | map(attribute='mount')"

- name: Validate | Find the disks holding the OS (/, /boot, /boot/efi, swap)
  ansible.builtin.shell: |
    set -o pipefail
    {
      for m in / /boot /boot/efi; do
        s=$(findmnt -no SOURCE "$m" 2>/dev/null) && lsblk -nsrpo NAME,TYPE "$s"
      done
      swapon --show=NAME --noheadings | while read -r s; do lsblk -nsrpo NAME,TYPE "$s"; done
    } | awk '$2 == "disk" {print $1}' | sort -u
  register: filesystems_os_disks
  changed_when: false
  check_mode: false

- name: Validate | Inspect each disk
  ansible.builtin.shell: |
    set -o pipefail
    d=$(readlink -e "{{ item.disk }}") || { echo "missing"; exit 3; }
    sigs=$(wipefs -n --noheadings -o TYPE "$d" | tr '\n' ' ')
    printf '{"real": "%s", "sigs": "%s", "lsblk": %s}\n' "$d" "$sigs" \
      "$(lsblk -J -b -p -o NAME,TYPE,SIZE,PTTYPE,FSTYPE,MOUNTPOINT,PARTLABEL "$d")"
  register: filesystems_disk_info
  changed_when: false
  check_mode: false
  failed_when: false
  loop: "{{ filesystems_volumes }}"
  loop_control:
    label: "{{ item.mount }} -> {{ item.disk }}"

- name: Validate | Disk exists, is a whole disk and isn't an OS disk
  vars:
    vol: "{{ item.item }}"
    info: "{{ item.stdout | from_json if item.rc == 0 else {} }}"
    dev: "{{ info.lsblk.blockdevices[0] if item.rc == 0 else {} }}"
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - dev.type == 'disk'
      - info.real not in filesystems_os_disks.stdout_lines
      - dev.size | int >= vol.min_size_gb * 1024 * 1024 * 1024
    fail_msg: >-
      {{ vol.mount }}: {{ vol.disk }} {{ 'does not exist' if item.rc != 0 else
      'is not usable (type ' ~ dev.type ~ ', ' ~ (dev.size | int | human_readable) ~
      ', OS disk: ' ~ (info.real in filesystems_os_disks.stdout_lines) ~ ', minimum ' ~ vol.min_size_gb ~ ' GB)' }}
    quiet: true
  loop: "{{ filesystems_disk_info.results }}"
  loop_control:
    label: "{{ item.item.mount }}"

# The partition name is how a disk is recognised as belonging to a mount point: the role
# names the partition after the volume when it creates it (main.yml: partname). A disk that
# carries another volume's name is in the wrong slot (disks reordered or removed), and is
# refused even when it is not mounted.
- name: Validate | Disk is blank, or already set up by this role for this mount point
  vars:
    vol: "{{ item.item }}"
    info: "{{ item.stdout | from_json }}"
    dev: "{{ info.lsblk.blockdevices[0] }}"
    children: "{{ dev.children | default([]) }}"
    blank: >-
      {{ dev.pttype is none and dev.fstype is none and children | length == 0 and info.sigs | trim == '' }}
    ours: >-
      {{ dev.pttype == 'gpt' and children | length == 1
         and children[0].fstype in [none, vol.fstype]
         and children[0].mountpoint in [none, vol.mount, vol.tmp]
         and (not (filesystems_check_partition_name | bool)
              or (children[0].partlabel | default(none)) == vol.partname) }}
  ansible.builtin.assert:
    that: blank | bool or ours | bool
    fail_msg: >-
      {{ vol.mount }}: {{ vol.disk }} ({{ info.real }}) is neither blank nor the disk this role set up
      for {{ vol.mount }}, so it won't be touched. Found: partition table '{{ dev.pttype }}',
      {{ children | length }} partition(s){% if children | length > 0 %}, the first one named
      '{{ children[0].partlabel | default('', true) }}' (expected '{{ vol.partname }}') with filesystem
      '{{ children[0].fstype }}' (expected '{{ vol.fstype }}'), mounted on
      '{{ children[0].mountpoint }}'{% endif %}; signatures '{{ info.sigs | trim }}'.
      Another partition name or mount point means another volume's disk is in this slot: check the
      order of the disks (Terraform: data_disks is a list, and a disk's place in it is its slot).
      Wipe the disk (wipefs -a) only if it really is the right one and holds nothing you need.
    quiet: true
  loop: "{{ filesystems_disk_info.results }}"
  loop_control:
    label: "{{ item.item.mount }}"
