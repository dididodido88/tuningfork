---
# prometheus-pve-exporter on the SIEM VM: reads the Proxmox VE API (read-only token) and serves
# the metrics to Prometheus. Installed into a virtualenv from the checked wheel bundle
# (siem_versions.yml, pve_exporter_wheels), never from the internet. Guide: docs/siem.md.

pve_exporter_listen_address: 127.0.0.1
pve_exporter_port: 9221

# Virtualenv per version: /opt/pve-exporter/<version>.
pve_exporter_base_dir: /opt/pve-exporter
pve_exporter_python: "python{{ pve_exporter_python_version }}"

# API token (Proxmox: Datacenter > Permissions > API Tokens) of a user with the PVEAuditor role,
# created with the Proxmox monitoring. Until the token is in the vault, Prometheus doesn't scrape.
pve_exporter_api_user: "{{ siem_pve_api_user | default('tuningfork-monitor@pve') }}"
pve_exporter_token_name: "{{ siem_pve_token_name | default('prometheus') }}"
pve_exporter_token_value: "{{ vault_pve_exporter_token_value | default('') }}"

# Check the Proxmox API certificate against the system trust store (internal CA and, with
# pve_exporter_trust_cluster_ca, the Proxmox cluster CA).
pve_exporter_verify_ssl: true

pve_exporter_user: pve-exporter

# Trust the Proxmox cluster's own CA (/etc/pve/pve-root-ca.pem, read from the first host in
# proxmox_hosts), which signs the nodes' API certificates unless they were replaced.
pve_exporter_trust_cluster_ca: true
