---
# Common CLI tools and SELinux utilities on every Rocky 9 host. Needs repositories.yml first (most come from EPEL).
# Package list: roles/cli_tools/defaults/main.yml; add more with cli_tools_extra_packages.

- name: Install common CLI tools
  hosts: rocky9
  become: true
  gather_facts: false
  roles:
    - role: cli_tools
      tags: [cli_tools]
