---
# NAS servers: NFS exports, the nfs-server service and the firewall. CIS would remove or mask NFS
# and rpcbind; playbooks/group_vars/nas_servers.yml keeps them on these hosts.
# Settings: inventories/<ENV>/group_vars/nas_servers.yml. Role: roles/nas_server/README.md.

- name: Configure NAS servers
  hosts: nas_servers
  become: true
  gather_facts: true
  roles:
    - role: nas_server
      tags: [nas_server]
