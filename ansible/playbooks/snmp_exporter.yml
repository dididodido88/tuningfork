---
# snmp_exporter on the SIEM VM: polls the iDRACs (SNMPv3) with the release's stock dell module.
# Prometheus polls through it once the SNMPv3 credentials are in the vault. Guide: docs/siem.md.

- name: snmp_exporter on the SIEM VM
  hosts: siem_servers
  become: true
  gather_facts: true
  # Artifacts come from the mirror (env_repo_base_url), HTTPS with a certificate from the internal CA.
  pre_tasks:
    - name: Check the internal CA is trusted (playbooks/certificates.yml ran)
      ansible.builtin.import_role:
        name: certificates
        tasks_from: verify_trust
      tags: [always]
  roles:
    - role: snmp_exporter
      tags: [snmp_exporter]
