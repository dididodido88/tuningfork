---
# Kubernetes bastion hosts: kubectl (shared kubectl role) plus helm, k9s, kubectx/kubens,
# shared cluster contexts and the login environment. Only AD users in the groups from
# sssd_ad_extra_ssh_groups (group_vars/k8s_bastions.yml) and the normal SSH/admin groups can log in.
# Settings: inventories/<ENV>/group_vars/k8s_bastions.yml. Mirror: docs/kubernetes-clients.md.

- name: Kubernetes bastion hosts
  hosts: k8s_bastions
  become: true
  gather_facts: false
  # The mirror (env_repo_base_url) is HTTPS with a certificate from the internal CA.
  pre_tasks:
    - name: Check the internal CA is trusted (playbooks/certificates.yml ran)
      ansible.builtin.import_role:
        name: certificates
        tasks_from: verify_trust
      tags: [always]
  roles:
    - role: kubectl
      tags: [kubectl]
    - role: k8s_bastion
      tags: [k8s_bastion]
