---
# Full run, in layer order:
#   certificates -> repositories -> data disks -> 1. CIS hardening -> 2. common OS config -> 3. server roles
#
#   ansible-playbook -i inventories/CRGS00 playbooks/site.yml    (run from the ansible/ directory)
#
# Limit with --limit <group|host> or --tags <tag>.

# First: trust the internal root CA and install host certificates, so later plays can reach
# internal HTTPS services (the mirror, Nexus) signed by that CA.
- name: Certificates
  ansible.builtin.import_playbook: certificates.yml

# Then point hosts at the internal mirror, since later plays install packages.
- name: Package repositories
  ansible.builtin.import_playbook: repositories.yml

# Before CIS: CIS rewrites an fstab entry (dropping UUID=) if a mount lacks one of
# its options, so the disks are mounted with those options first.
- name: Data disks
  ansible.builtin.import_playbook: filesystems.yml

- name: CIS hardening
  ansible.builtin.import_playbook: cis_rhel9.yml

- name: Common Linux configuration
  ansible.builtin.import_playbook: linux_common.yml

- name: Common Windows configuration
  ansible.builtin.import_playbook: windows_common.yml

- name: NFS servers
  ansible.builtin.import_playbook: nfs_server.yml

- name: Database servers
  ansible.builtin.import_playbook: database_server.yml

- name: Nexus Repository servers
  ansible.builtin.import_playbook: nexus_server.yml
