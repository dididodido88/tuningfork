---
# kubectl on every host in kubectl_hosts (Kubernetes bastions are a child group; add other
# hosts, e.g. CI runners, directly). Version: kubectl_version in group_vars/all/main.yml.
# Mirror layout: docs/kubernetes-clients.md.

- name: Install kubectl
  hosts: kubectl_hosts
  become: true
  gather_facts: false
  # The mirror (env_repo_base_url) is HTTPS with a certificate from the internal CA.
  pre_tasks:
    - name: Check the internal CA is trusted (playbooks/certificates.yml ran)
      ansible.builtin.import_role:
        name: certificates
        tasks_from: verify_trust
      tags: [always]
  roles:
    - role: kubectl
      tags: [kubectl]
