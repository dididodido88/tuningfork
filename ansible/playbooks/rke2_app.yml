---
# The application RKE2 cluster: 1 or 3 RKE2 server nodes for the application workloads, with a
# local /scratch disk. Two modes, set with app_cluster_rancher_managed in
# inventories/<ENV>/group_vars/all/main.yml:
#   false  standalone: installs RKE2 from the mirror (images from Harbor) and writes the admin
#          kubeconfig ~/.kube/<ENV>-app-cluster.yaml on the control node
#   true   managed by Rancher Server: prepares the hosts, joins each to the Rancher-defined cluster
#          (rke2_rancher_cluster) with its registration token, and writes the admin kubeconfig
# Needs first: the common layers, Harbor with the images, and playbooks/load_balancer.yml (nodes
# after the first join through lb-app). site.yml runs them in that order.
# Settings: inventories/<ENV>/group_vars/rke2_app.yml. Guide: docs/app-cluster.md.

- name: Application RKE2 cluster
  hosts: rke2_app
  become: true
  gather_facts: true
  # One node at a time, first node first (see playbooks/rke2_rancher.yml).
  serial: 1
  order: sorted
  max_fail_percentage: 0
  # The mirror (env_repo_base_url) and Harbor use certificates from the internal CA.
  pre_tasks:
    - name: Check the internal CA is trusted (playbooks/certificates.yml ran)
      ansible.builtin.import_role:
        name: certificates
        tasks_from: verify_trust
      tags: [always]
  roles:
    - role: rke2_server
      tags: [rke2_server, rke2_app]
