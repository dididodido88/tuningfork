---
# Prometheus node_exporter. Phase 3: the SIEM VM only; the Rocky VMs and Proxmox hosts follow
# with the agents. Guide: docs/siem.md.

- name: Node exporter
  hosts: siem_servers
  become: true
  gather_facts: true
  # Artifacts come from the mirror (env_repo_base_url), HTTPS with a certificate from the internal CA.
  pre_tasks:
    - name: Check the internal CA is trusted (playbooks/certificates.yml ran)
      ansible.builtin.import_role:
        name: certificates
        tasks_from: verify_trust
      tags: [always]
  roles:
    - role: node_exporter
      tags: [node_exporter]
