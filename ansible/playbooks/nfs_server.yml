---
# NFS servers: exports, the nfs-server service and the firewall. CIS would remove or mask NFS
# and rpcbind; playbooks/group_vars/nfs_servers.yml keeps them on these hosts.
# Settings: inventories/<ENV>/group_vars/nfs_servers.yml. Role: roles/nfs_server/README.md.

- name: Configure NFS servers
  hosts: nfs_servers
  become: true
  gather_facts: true
  roles:
    - role: nfs_server
      tags: [nfs_server]
