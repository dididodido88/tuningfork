---
# Root CA trust and pre-generated host certificates. Must run first (site.yml does): every play
# that downloads from the HTTPS mirror (env_repo_base_url) checks the CA is trusted.
#
# Files are read on the control node from
#   /srv/security/certificates/files/<certificates_env_dir>/{ca,<short hostname>}/
# (outside this repository), as the user running ansible-playbook. Set certificates_env_dir
# in inventories/<ENV>/group_vars/all/main.yml. See roles/certificates/defaults/main.yml.

- name: Deploy certificates
  hosts: rocky9
  become: true
  gather_facts: false
  roles:
    - role: certificates
      tags: [certificates]
