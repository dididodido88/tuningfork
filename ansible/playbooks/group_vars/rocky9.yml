---
# How RHEL9-CIS and linux_common share settings. Applies to every environment.
#
# Variables in this playbook-level group_vars file override inventory group_vars,
# so environments cannot change these. Change the linux_common_* values in
# inventories/<ENV>/group_vars/linux.yml instead.
#
# When a linux_common area is enabled it owns that area and the matching CIS
# remediation rule is turned off, so the two roles never write the same file.
# When an area is disabled in linux_common, CIS manages it again.

# NTP: linux_common writes /etc/chrony.conf (CIS 2.3.2).
# CIS 2.3.1 (chrony installed) and 2.3.3 (chrony not running as root) stay on.
rhel9cis_rule_2_3_2: "{{ not (linux_common_ntp_enabled | default(true) | bool) }}"
rhel9cis_time_synchronization_servers: "{{ linux_common_ntp_servers | default([]) }}"

# Banners: linux_common writes /etc/motd, /etc/issue, /etc/issue.net (CIS 1.7.1-1.7.3).
# CIS 1.7.4-1.7.6 (file permissions) stay on. The GDM banner (if a GUI is present)
# also uses this text.
rhel9cis_rule_1_7_1: "{{ not (linux_common_banner_enabled | default(true) | bool) }}"
rhel9cis_rule_1_7_2: "{{ not (linux_common_banner_enabled | default(true) | bool) }}"
rhel9cis_rule_1_7_3: "{{ not (linux_common_banner_enabled | default(true) | bool) }}"
rhel9cis_warning_banner: "{{ linux_common_banner_text | default('Authorized users only. All activity may be monitored and reported.') }}"

# IPv6: linux_common sets disable_ipv6 (CIS 3.1.1). The CIS IPv6 network
# rules (3.3.x) still follow whether IPv6 is in use.
rhel9cis_rule_3_1_1: "{{ not (linux_common_ipv6_manage | default(true) | bool) }}"
rhel9cis_ipv6_required: "{{ linux_common_ipv6_enabled | default(false) | bool }}"

# journald: linux_common writes the rotation and retention drop-in (CIS 6.2.1.3).
# CIS 6.2.2.3 (Compress) and 6.2.2.4 (Storage=persistent) stay on; linux_common's
# zz-tuningfork.conf drop-in is read last, so its values win.
rhel9cis_rule_6_2_1_3: "{{ not (linux_common_journald_enabled | default(true) | bool) }}"
# Use journald as the logging service (2.2.0 defaults to rsyslog).
rhel9cis_syslog: journald

# ---------------------------------------------------------------------------
# Lockout protection. Works with roles/cis_safeguards (pre-checks before CIS,
# post-checks after). Environments set the cis_safeguards_* values in
# inventories/<ENV>/group_vars/rocky9.yml.
# ---------------------------------------------------------------------------

# SSH access (5.1.7): the role default sets AllowUsers to the Ansible account
# only, which shuts out every other user. Use AllowGroups instead.
rhel9cis_sshd_allowusers: ""
rhel9cis_sshd_allowgroups: "{{ cis_safeguards_ssh_allow_groups | default(['sshusers', 'wheel']) | join(' ') }}"

# sudo (5.2.4): CIS turns NOPASSWD into PASSWD. Keep it for the Ansible
# account's drop-in, or the next run can't become root.
rhel9cis_sudoers_exclude_nopasswd_list:
  - "{{ cis_safeguards_account | default(ansible_user) | default('ansible') }}"

# Password ageing (5.4.1.x): don't apply the new limits to existing accounts,
# which can expire accounts mid-session.
rhel9cis_force_user_maxdays: false
rhel9cis_force_user_mindays: false
rhel9cis_force_user_warnage: false

# faillock (5.3.3.1.3): root unlocks itself after rhel9cis_root_unlock_time
# seconds instead of staying locked, so console break-glass access survives
# failed attempts. Both options are accepted by CIS.
rhel9cis_pamroot_lock_option: "root_unlock_time = {{ rhel9cis_root_unlock_time }}"

# authselect: CIS stops unless the example profile name is changed.
rhel9cis_authselect_custom_profile_name: tuningfork-cis

# GRUB password (1.4.1) would block unattended reboots into other kernels and
# console recovery without the password; it stays off.
rhel9cis_set_boot_pass: false
