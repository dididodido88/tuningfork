---
# prometheus-pve-exporter on the SIEM VM, from the checked wheel bundle. Prometheus scrapes it once
# the Proxmox API token is in the vault. Guide: docs/siem.md.

- name: Proxmox VE exporter on the SIEM VM
  hosts: siem_servers
  become: true
  gather_facts: true
  # Artifacts come from the mirror (env_repo_base_url), HTTPS with a certificate from the internal CA.
  pre_tasks:
    - name: Check the internal CA is trusted (playbooks/certificates.yml ran)
      ansible.builtin.import_role:
        name: certificates
        tasks_from: verify_trust
      tags: [always]
  roles:
    - role: pve_exporter
      tags: [pve_exporter]
